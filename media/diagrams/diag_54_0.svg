<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 292" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Пирамида тестирования</text><rect x="170" y="34" width="200" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="270" y="46" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="270" dy="0">E2E / UI</tspan><tspan x="270" dy="16">медленно, дорого</tspan></text><rect x="120" y="82" width="260" height="40" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="250" y="94" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="250" dy="0">Интеграционные тесты</tspan><tspan x="250" dy="16">API, БД, сервисы</tspan></text><rect x="60" y="130" width="360" height="40" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="240" y="142" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="240" dy="0">Компонентные тесты / модульные</tspan><tspan x="240" dy="16">отдельные классы и функции</tspan></text><rect x="20" y="178" width="460" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="250" y="190" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="250" dy="0">Юнит-тесты (Unit Tests) — большинство</tspan><tspan x="250" dy="16">одна функция/метод, изолированно, быстро</tspan></text><text x="270" y="232" text-anchor="middle" font-size="11" fill="#475569">pytest: assert result == expected  |  @pytest.fixture  |  @pytest.mark.parametrize</text><rect x="20" y="242" width="500" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="270" y="252" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">Мок: unittest.mock.patch()  — заменить зависимость</tspan><tspan x="270" dy="16">Faker, factory_boy  — генерация тестовых данных</tspan></text></svg>