<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 266" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Нотация Big-O: оценка сложности алгоритмов</text><text x="80" y="36" text-anchor="middle" font-size="11" fill="#334155">Обозначение</text><text x="200" y="36" text-anchor="middle" font-size="11" fill="#334155">Название</text><text x="340" y="36" text-anchor="middle" font-size="11" fill="#334155">Пример</text><text x="470" y="36" text-anchor="middle" font-size="11" fill="#334155">n=1000</text><rect x="20" y="46" width="120" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="80" y="59" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="80" dy="0">O(1)</tspan></text><text x="200" y="59" text-anchor="middle" font-size="11" fill="#15803d">константа</text><text x="340" y="59" text-anchor="middle" font-size="11" fill="#475569">поиск по ключу dict</text><text x="470" y="59" text-anchor="middle" font-size="11" fill="#15803d">1</text><rect x="20" y="76" width="120" height="26" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="80" y="89" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="80" dy="0">O(log n)</tspan></text><text x="200" y="89" text-anchor="middle" font-size="11" fill="#0369a1">логарифмическая</text><text x="340" y="89" text-anchor="middle" font-size="11" fill="#475569">бинарный поиск</text><text x="470" y="89" text-anchor="middle" font-size="11" fill="#0369a1">10</text><rect x="20" y="106" width="120" height="26" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="80" y="119" text-anchor="middle" font-size="12" fill="#854d0e" dominant-baseline="middle"><tspan x="80" dy="0">O(n)</tspan></text><text x="200" y="119" text-anchor="middle" font-size="11" fill="#854d0e">линейная</text><text x="340" y="119" text-anchor="middle" font-size="11" fill="#475569">перебор списка</text><text x="470" y="119" text-anchor="middle" font-size="11" fill="#854d0e">1000</text><rect x="20" y="136" width="120" height="26" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="80" y="149" text-anchor="middle" font-size="12" fill="#9a3412" dominant-baseline="middle"><tspan x="80" dy="0">O(n log n)</tspan></text><text x="200" y="149" text-anchor="middle" font-size="11" fill="#9a3412">линейно-лог.</text><text x="340" y="149" text-anchor="middle" font-size="11" fill="#475569">sort(), merge sort</text><text x="470" y="149" text-anchor="middle" font-size="11" fill="#9a3412">10000</text><rect x="20" y="166" width="120" height="26" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="80" y="179" text-anchor="middle" font-size="12" fill="#991b1b" dominant-baseline="middle"><tspan x="80" dy="0">O(n²)</tspan></text><text x="200" y="179" text-anchor="middle" font-size="11" fill="#991b1b">квадратичная</text><text x="340" y="179" text-anchor="middle" font-size="11" fill="#475569">вложенный цикл</text><text x="470" y="179" text-anchor="middle" font-size="11" fill="#991b1b">1000000</text><rect x="20" y="196" width="120" height="26" rx="5" fill="#fdf2f8" stroke="#9333ea" stroke-width="1.5"/><text x="80" y="209" text-anchor="middle" font-size="12" fill="#6b21a8" dominant-baseline="middle"><tspan x="80" dy="0">O(2ⁿ)</tspan></text><text x="200" y="209" text-anchor="middle" font-size="11" fill="#6b21a8">экспоненциальная</text><text x="340" y="209" text-anchor="middle" font-size="11" fill="#475569">перебор подмножеств</text><text x="470" y="209" text-anchor="middle" font-size="11" fill="#6b21a8">2^1000</text><rect x="20" y="226" width="500" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="270" y="240" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">n=1000: O(1)=1 | O(log n)=10 | O(n)=1000 | O(n²)=1 000 000 | O(2ⁿ)=невозможно</tspan></text></svg>