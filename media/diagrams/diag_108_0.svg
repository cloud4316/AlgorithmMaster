<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 222" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Библиотека requests: HTTP-запросы</text><rect x="20" y="36" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" /><text x="270" y="46" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">import requests</tspan><tspan x="270" dy="16">r = requests.get("https://api.example.com/data", headers={"Authorization":"Bearer TOKEN"})</tspan></text><rect x="20" y="80" width="120" height="54" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="80" y="97" text-anchor="middle" font-size="13" fill="#15803d" dominant-baseline="middle"><tspan x="80" dy="0">GET</tspan></text><rect x="150" y="80" width="120" height="34" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="210" y="97" text-anchor="middle" font-size="13" fill="#0369a1" dominant-baseline="middle"><tspan x="210" dy="0">POST</tspan></text><rect x="280" y="80" width="120" height="34" rx="15" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" /><text x="340" y="97" text-anchor="middle" font-size="13" fill="#854d0e" dominant-baseline="middle"><tspan x="340" dy="0">PUT/PATCH</tspan></text><rect x="410" y="80" width="110" height="34" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="465" y="97" text-anchor="middle" font-size="13" fill="#991b1b" dominant-baseline="middle"><tspan x="465" dy="0">DELETE</tspan></text><rect x="20" y="122" width="235" height="60" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" /><text x="137" y="120" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0">r.status_code  →  200</tspan><tspan x="137" dy="16">r.json()  →  dict</tspan><tspan x="137" dy="16">r.text  →  строка</tspan><tspan x="137" dy="16">r.headers  →  dict</tspan></text><rect x="285" y="122" width="235" height="44" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5" /><text x="402" y="128" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="402" dy="0">requests.post(url, json=data)</tspan><tspan x="402" dy="16">requests.get(url, params={"k":"v"})</tspan><tspan x="402" dy="16">session=requests.Session()</tspan></text><rect x="20" y="174" width="500" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" /><text x="270" y="183" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="270" dy="0">Обработка: if r.status_code==200: data=r.json()</tspan><tspan x="270" dy="16">r.raise_for_status()  — исключение при ошибке 4xx/5xx</tspan></text></svg>