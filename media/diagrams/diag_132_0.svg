<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 232" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Пайплайн генераторов: потоковая обработка</text><rect x="20" y="36" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="54" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0"># Каждый генератор обрабатывает один элемент за раз — O(1) память!</tspan></text><rect x="20" y="80" width="155" height="40" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="97" y="92" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">Источник</tspan><tspan x="97" dy="17">open("log.txt")</tspan></text><line x1="175" y1="100" x2="215" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="215" y="80" width="155" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="292" y="84" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="292" dy="0">Фильтр</tspan><tspan x="292" dy="16">(l for l in f</tspan><tspan x="292" dy="16">if "ERROR" in l)</tspan></text><line x1="370" y1="100" x2="410" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="410" y="80" width="110" height="40" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="465" y="92" text-anchor="middle" font-size="12" fill="#854d0e" dominant-baseline="middle"><tspan x="465" dy="0">Потребитель</tspan><tspan x="465" dy="17">for l in gen</tspan></text><rect x="20" y="130" width="500" height="44" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="136" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">lines=(l.strip() for l in open("f.txt"))   # gen</tspan><tspan x="270" dy="16">errors=(l for l in lines if "ERROR" in l)   # gen</tspan><tspan x="270" dy="16">for e in errors: process(e)  # только тут читаем файл!</tspan></text><rect x="20" y="182" width="235" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="137" y="192" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0">itertools.chain(g1,g2)  — соединить</tspan><tspan x="137" dy="16">itertools.islice(g,10)  — первые 10</tspan></text><rect x="285" y="182" width="235" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="402" y="192" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="402" dy="0">itertools.groupby(data,key)</tspan><tspan x="402" dy="16">itertools.product(a,b)  — декарт</tspan></text></svg>