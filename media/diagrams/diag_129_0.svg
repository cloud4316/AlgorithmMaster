<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 208" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Метаклассы: классы классов</text><rect x="20" y="36" width="235" height="40" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="137" y="48" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">type — метакласс по умолчанию</tspan><tspan x="137" dy="16">type(obj)→класс | type("X",(B,),{})</tspan></text><rect x="285" y="36" width="235" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="402" y="48" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">Объект → Класс → Метакласс → type</tspan><tspan x="402" dy="16">type создаёт классы в Python</tspan></text><rect x="20" y="84" width="500" height="74" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" /><text x="270" y="80" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">class Meta(type):</tspan><tspan x="270" dy="16">    def __new__(mcs,name,bases,ns):</tspan><tspan x="270" dy="16">        ns["created_at"]=datetime.now()</tspan><tspan x="270" dy="16">        return super().__new__(mcs,name,bases,ns)</tspan><tspan x="270" dy="16">class MyClass(metaclass=Meta): pass</tspan></text><rect x="20" y="148" width="235" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="137" y="154" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="137" dy="0">Когда нужен метакласс:</tspan><tspan x="137" dy="16">Авторегистрация подклассов</tspan><tspan x="137" dy="16">Валидация методов</tspan></text><rect x="285" y="148" width="235" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" /><text x="402" y="154" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="402" dy="0">Часто проще:</tspan><tspan x="402" dy="16">@classmethod __init_subclass__</tspan><tspan x="402" dy="16">или декораторы класса</tspan></text></svg>