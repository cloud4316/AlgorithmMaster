<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 232" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Timsort — сортировка Python: O(n log n)</text><rect x="20" y="36" width="500" height="40" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="56" text-anchor="middle" font-size="13" fill="#e2e8f0" dominant-baseline="middle"><tspan x="270" dy="0">Timsort = Merge Sort + Insertion Sort  (Тим Питерс, 2002)</tspan></text><text x="270" y="90" text-anchor="middle" font-size="11" fill="#334155">Шаг 1: разбить массив на «run» — уже отсортированные куски (≥32 элем.)</text><rect x="20" y="102" width="82" height="34" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="61" y="119" text-anchor="middle" font-size="12" fill="#1e293b" dominant-baseline="middle"><tspan x="61" dy="0">run 1</tspan></text><rect x="106" y="102" width="82" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="147" y="119" text-anchor="middle" font-size="12" fill="#1e293b" dominant-baseline="middle"><tspan x="147" dy="0">run 2</tspan></text><rect x="192" y="102" width="82" height="34" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="233" y="119" text-anchor="middle" font-size="12" fill="#1e293b" dominant-baseline="middle"><tspan x="233" dy="0">run 3</tspan></text><rect x="278" y="102" width="82" height="34" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="319" y="119" text-anchor="middle" font-size="12" fill="#1e293b" dominant-baseline="middle"><tspan x="319" dy="0">run 4</tspan></text><rect x="364" y="102" width="82" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="405" y="119" text-anchor="middle" font-size="12" fill="#1e293b" dominant-baseline="middle"><tspan x="405" dy="0">run 5</tspan></text><rect x="450" y="102" width="82" height="34" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="491" y="119" text-anchor="middle" font-size="12" fill="#1e293b" dominant-baseline="middle"><tspan x="491" dy="0">run 6</tspan></text><text x="270" y="148" text-anchor="middle" font-size="11" fill="#334155">Шаг 2: слить runs методом merge sort</text><rect x="20" y="158" width="500" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="172" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">Гарантии Timsort:</tspan><tspan x="270" dy="16">O(n) для почти отсортированных | O(n log n) в худшем случае | Стабильная</tspan></text><text x="270" y="218" text-anchor="middle" font-size="11" fill="#059669">list.sort() и sorted() в Python всегда используют Timsort</text></svg>