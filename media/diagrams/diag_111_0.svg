<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 212" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">pathlib: объектно-ориентированная работа с путями</text><rect x="20" y="36" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" /><text x="270" y="46" text-anchor="middle" font-size="12" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">from pathlib import Path</tspan><tspan x="270" dy="17">p = Path("/home/user/docs/report.txt")</tspan></text><rect x="20" y="80" width="235" height="48" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="137" y="82" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">p.name  →  "report.txt"</tspan><tspan x="137" dy="16">p.stem  →  "report"</tspan><tspan x="137" dy="16">p.suffix  →  ".txt"</tspan></text><rect x="285" y="80" width="235" height="48" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="402" y="82" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">p.parent  →  Path("/home/user/docs")</tspan><tspan x="402" dy="16">p.parts  →  кортеж</tspan><tspan x="402" dy="16">p / "sub" / "f.txt"  — соединить</tspan></text><rect x="20" y="124" width="235" height="38" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" /><text x="137" y="135" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">p.exists()  | p.is_file()  | p.is_dir()</tspan><tspan x="137" dy="16">p.mkdir(parents=True,exist_ok=True)</tspan></text><rect x="285" y="124" width="235" height="48" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="402" y="127" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="402" dy="0">p.read_text(encoding="utf-8")</tspan><tspan x="402" dy="16">p.write_text("данные")</tspan><tspan x="402" dy="16">list(p.glob("**/*.py"))</tspan></text><rect x="20" y="170" width="500" height="28" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="270" y="184" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="270" dy="0">Path.cwd() — текущий каталог | Path.home() — домашний каталог пользователя</tspan></text></svg>