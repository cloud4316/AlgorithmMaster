<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 218" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">NumPy ndarray: массивы и операции</text><rect x="20" y="36" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="46" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">import numpy as np</tspan><tspan x="270" dy="16">a=np.array([1,2,3]);  m=np.zeros((3,3));  r=np.arange(0,10,0.5)</tspan></text><rect x="20" y="80" width="235" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="84" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">a.shape  (строки,столбцы)</tspan><tspan x="137" dy="16">a.dtype  float64,int32...</tspan><tspan x="137" dy="16">a.ndim   число измерений</tspan></text><rect x="285" y="80" width="235" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="84" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">a*2  a+b  a@b  — векторизация</tspan><tspan x="402" dy="16">np.sum(a)  np.mean(a)</tspan><tspan x="402" dy="16">np.dot(a,b)  — скалярное произв.</tspan></text><rect x="20" y="128" width="235" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="137" y="132" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">Индексация:</tspan><tspan x="137" dy="16">a[1,2]  a[0:2,:]  a[a>5]</tspan><tspan x="137" dy="16">Fancy: a[[0,2,4]]</tspan></text><rect x="285" y="128" width="235" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="402" y="132" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="402" dy="0">a.reshape(3,4)</tspan><tspan x="402" dy="16">a.T  — транспонирование</tspan><tspan x="402" dy="16">np.concatenate([a,b])</tspan></text><rect x="20" y="176" width="500" height="28" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="270" y="190" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="270" dy="0">NumPy в 10-100 раз быстрее Python-циклов. Хранится в C-массиве, нет boxing/unboxing!</tspan></text></svg>