<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="280" y="18" text-anchor="middle" font-size="13" fill="#1e293b">Вложенные условия: дерево решений</text><polygon points="280,24 400,60 280,96 160,60" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="280" y="60" text-anchor="middle" font-size="13" fill="#1e293b" dominant-baseline="middle">age >= 18?</text><path d="M 160 60 L 80 130" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ahr)"/><text x="105" y="98" text-anchor="middle" font-size="11" fill="#dc2626">Нет</text><rect x="20" y="130" width="120" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="80" y="150" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="80" dy="0">«Вам нет 18 лет»</tspan></text><path d="M 400 60 L 480 130" stroke="#059669" stroke-width="1.5" marker-end="url(#ah2)"/><text x="455" y="98" text-anchor="middle" font-size="11" fill="#059669">Да</text><polygon points="480,140 555,170 480,200 405,170" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/><text x="480" y="170" text-anchor="middle" font-size="12" fill="#1e293b" dominant-baseline="middle">студент?</text><path d="M 405 170 L 330 230" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ahr)"/><text x="352" y="203" text-anchor="middle" font-size="11" fill="#dc2626">Нет</text><path d="M 555 170 L 520 230" stroke="#059669" stroke-width="1.5" marker-end="url(#ah2)"/><text x="546" y="203" text-anchor="middle" font-size="11" fill="#059669">Да</text><rect x="270" y="230" width="120" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="330" y="250" text-anchor="middle" font-size="12" fill="#991b1b" dominant-baseline="middle"><tspan x="330" dy="0">Полная цена</tspan></text><rect x="450" y="230" width="120" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="510" y="250" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="510" dy="0">Скидка 50%</tspan></text><text x="280" y="302" text-anchor="middle" font-size="11" fill="#64748b">Каждый ромб — одно условие (if). Глубина = количество вложений.</text></svg>