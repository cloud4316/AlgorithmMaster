<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 232" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">CSV: чтение и запись таблиц</text><rect x="20" y="36" width="500" height="36" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="270" y="54" text-anchor="middle" font-size="12" fill="#854d0e" dominant-baseline="middle"><tspan x="270" dy="0">имя,возраст,город  →  разделитель по умолчанию = запятая</tspan></text><rect x="20" y="80" width="235" height="56" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="84" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">import csv</tspan><tspan x="137" dy="16">with open("f.csv","r") as f:</tspan><tspan x="137" dy="16">    reader=csv.DictReader(f)</tspan><tspan x="137" dy="16">    for row in reader: ...</tspan></text><rect x="285" y="80" width="235" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="84" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">with open("f.csv","w",newline="") as f:</tspan><tspan x="402" dy="16">    w=csv.DictWriter(f,fieldnames=[...])</tspan><tspan x="402" dy="16">    w.writeheader()</tspan><tspan x="402" dy="16">    w.writerow({"имя":"Анна"})</tspan></text><rect x="20" y="144" width="235" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="137" y="156" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="137" dy="0">DictReader: строки как dict</tspan><tspan x="137" dy="16">{"имя":"Анна","возраст":"25"}</tspan></text><rect x="285" y="144" width="235" height="40" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="402" y="156" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="402" dy="0">newline=""  обязателен!</tspan><tspan x="402" dy="16">bez — дублирование строк на Windows</tspan></text><rect x="20" y="192" width="500" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="270" y="206" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">Pandas: pd.read_csv("f.csv") | df.to_csv("out.csv",index=False) — проще для анализа</tspan></text></svg>