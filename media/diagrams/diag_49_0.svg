<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 224" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Явное и неявное преобразование типов</text><rect x="20" y="36" width="230" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="135" y="58" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="135" dy="0">Неявное (implicit)</tspan><tspan x="135" dy="17">3 + 4.0 → 7.0  (int → float авто)</tspan></text><rect x="290" y="36" width="230" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="405" y="58" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="405" dy="0">Явное (explicit)</tspan><tspan x="405" dy="17">int("42") → 42  (вы указываете)</tspan></text><text x="270" y="110" text-anchor="middle" font-size="12" fill="#334155">Безопасные (без потерь) vs Небезопасные:</text><rect x="20" y="122" width="235" height="52" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="137" y="140" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0">int→float: 5→5.0  ✓</tspan><tspan x="137" dy="17">bool→int: True→1  ✓</tspan></text><rect x="285" y="122" width="235" height="52" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="402" y="140" text-anchor="middle" font-size="12" fill="#991b1b" dominant-baseline="middle"><tspan x="402" dy="0">float→int: 3.9→3  ОБРЕЗАНИЕ!</tspan><tspan x="402" dy="17">str→int: "3x" → ValueError!</tspan></text><rect x="20" y="182" width="500" height="30" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="270" y="197" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="270" dy="0">Правило: Python НЕ делает неявных потерь. Явное лучше неявного (Zen of Python).</tspan></text></svg>