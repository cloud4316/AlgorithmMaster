<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 258" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Системы счисления и битовые операции</text><rect x="20" y="36" width="155" height="40" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="97" y="48" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">0b1010  двоичное</tspan><tspan x="97" dy="16">bin(10) = "0b1010"</tspan></text><rect x="193" y="36" width="155" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="48" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">0o17  восьмеричное</tspan><tspan x="270" dy="16">oct(15) = "0o17"</tspan></text><rect x="366" y="36" width="155" height="40" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="443" y="48" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="443" dy="0">0xFF  шестнадцатеричное</tspan><tspan x="443" dy="16">hex(255) = "0xff"</tspan></text><rect x="20" y="86" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="104" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">10 = 1010₂ = 12₈ = A₁₆    |    int("FF",16)=255    |    int("1010",2)=10</tspan></text><text x="270" y="136" text-anchor="middle" font-size="12" fill="#334155">Битовые операторы:</text><rect x="20" y="146" width="95" height="28" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="67" y="160" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="67" dy="0">&amp; AND</tspan></text><rect x="123" y="146" width="95" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="170" y="160" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="170" dy="0">| OR</tspan></text><rect x="226" y="146" width="95" height="28" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="273" y="160" text-anchor="middle" font-size="12" fill="#4c1d95" dominant-baseline="middle"><tspan x="273" dy="0">^ XOR</tspan></text><rect x="329" y="146" width="95" height="28" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="376" y="160" text-anchor="middle" font-size="12" fill="#991b1b" dominant-baseline="middle"><tspan x="376" dy="0">~ NOT</tspan></text><rect x="20" y="182" width="235" height="28" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="137" y="196" text-anchor="middle" font-size="12" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">&lt;&lt; сдвиг влево (×2)</tspan></text><rect x="285" y="182" width="235" height="28" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="402" y="196" text-anchor="middle" font-size="12" fill="#9a3412" dominant-baseline="middle"><tspan x="402" dy="0">&gt;&gt; сдвиг вправо (÷2)</tspan></text><rect x="20" y="218" width="500" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="270" y="232" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">5 &amp; 3 = 1  |  5 | 3 = 7  |  5 ^ 3 = 6  |  n&lt;&lt;1 = n*2  (быстрее умножения!)</tspan></text></svg>