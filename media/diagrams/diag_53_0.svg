iddle" font-size="10" fill="#64748b">искать правее</text><text x="350" y="96" text-anchor="middle" font-size="10" fill="#16a34a">цель=13 ✓</text><rect x="20" y="108" width="500" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="270" y="146" text-anchor="middle" font-size="12" fill="#1e293b" dominant-baseline="middle"><tspan x="270" dy="0"></tspan></text><text x="270" y="126" text-anchor="middle" font-size="12" fill="#334155">left=0, right=n-1</text><text x="270" y="144" text-anchor="middle" font-size="12" fill="#4c1d95">mid = (left+right)//2</text><text x="270" y="162" text-anchor="middle" font-size="11" fill="#475569">arr[mid]==цель: найдено! | arr[mid]<цель: left=mid+1 | иначе: right=mid-1</text><text x="270" y="182" text-anchor="middle" font-size="11" fill="#059669">За 10 шагов находим в 1024 элементах: log₂(1024)=10</text><rect x="20" y="192" width="230" height="30" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="135" y="207" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="135" dy="0">Линейный O(n): до 19 сравнений</tspan></text><rect x="290" y="192" width="230" height="30" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="405" y="207" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="405" dy="0">Бинарный O(log n): до 4 сравнений</tspan></text></svg>