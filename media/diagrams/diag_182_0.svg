<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 246" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Методы словаря: главные операции</text><rect x="20" y="36" width="235" height="34" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="53" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">d.get(key, default) - без KeyError</tspan></text><rect x="275" y="36" width="245" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="397" y="53" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="397" dy="0">d.setdefault(k,v) - добавить если нет</tspan></text><rect x="20" y="78" width="235" height="34" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="137" y="95" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">d.update({k:v}) - обновить/добавить</tspan></text><rect x="275" y="78" width="245" height="34" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="397" y="95" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="397" dy="0">d.pop(k, default) - удалить и вернуть</tspan></text><rect x="20" y="120" width="235" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="137" y="137" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="137" dy="0">d.items() - пары (ключ, значение)</tspan></text><rect x="275" y="120" width="245" height="34" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="397" y="137" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="397" dy="0">d.keys() / d.values()</tspan></text><rect x="20" y="162" width="500" height="36" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="180" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">merged = d1 | d2  (Python 3.9+)  |  d1 |= d2</tspan></text><rect x="20" y="206" width="500" height="28" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="270" y="220" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">for k,v in d.items(): print(k, v) - перебор пар</tspan></text></svg>