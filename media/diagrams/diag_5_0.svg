<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">s = "Python"</text><rect x="90" y="28" width="56" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="118" y="52" text-anchor="middle" font-size="20" fill="#1e293b" dominant-baseline="middle"><tspan x="118" dy="0">P</tspan></text><text x="118" y="86" text-anchor="middle" font-size="12" fill="#059669">0</text><text x="118" y="100" text-anchor="middle" font-size="12" fill="#dc2626">-6</text><rect x="150" y="28" width="56" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="178" y="52" text-anchor="middle" font-size="20" fill="#1e293b" dominant-baseline="middle"><tspan x="178" dy="0">y</tspan></text><text x="178" y="86" text-anchor="middle" font-size="12" fill="#059669">1</text><text x="178" y="100" text-anchor="middle" font-size="12" fill="#dc2626">-5</text><rect x="210" y="28" width="56" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="238" y="52" text-anchor="middle" font-size="20" fill="#1e293b" dominant-baseline="middle"><tspan x="238" dy="0">t</tspan></text><text x="238" y="86" text-anchor="middle" font-size="12" fill="#059669">2</text><text x="238" y="100" text-anchor="middle" font-size="12" fill="#dc2626">-4</text><rect x="270" y="28" width="56" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="298" y="52" text-anchor="middle" font-size="20" fill="#1e293b" dominant-baseline="middle"><tspan x="298" dy="0">h</tspan></text><text x="298" y="86" text-anchor="middle" font-size="12" fill="#059669">3</text><text x="298" y="100" text-anchor="middle" font-size="12" fill="#dc2626">-3</text><rect x="330" y="28" width="56" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="358" y="52" text-anchor="middle" font-size="20" fill="#1e293b" dominant-baseline="middle"><tspan x="358" dy="0">o</tspan></text><text x="358" y="86" text-anchor="middle" font-size="12" fill="#059669">4</text><text x="358" y="100" text-anchor="middle" font-size="12" fill="#dc2626">-2</text><rect x="390" y="28" width="56" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="418" y="52" text-anchor="middle" font-size="20" fill="#1e293b" dominant-baseline="middle"><tspan x="418" dy="0">n</tspan></text><text x="418" y="86" text-anchor="middle" font-size="12" fill="#059669">5</text><text x="418" y="100" text-anchor="middle" font-size="12" fill="#dc2626">-1</text><text x="270" y="116" text-anchor="middle" font-size="11" fill="#475569">зелёные — положительные [0..5],  красные — отрицательные [-6..-1]</text><rect x="-102" y="130" width="240" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="18" y="147" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="18" dy="0">s.upper() → "PYTHON"</tspan></text><rect x="146" y="130" width="240" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="266" y="147" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="266" dy="0">s.lower() → "python"</tspan></text><rect x="394" y="130" width="240" height="34" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="514" y="147" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="514" dy="0">s[0:3] → "Pyt"</tspan></text><rect x="-102" y="170" width="240" height="34" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="18" y="187" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="18" dy="0">s[::-1] → "nohtyP"</tspan></text><rect x="146" y="170" width="240" height="34" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="266" y="187" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="266" dy="0">s.replace("P","J") → "Jython"</tspan></text><rect x="394" y="170" width="240" height="34" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="514" y="187" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="514" dy="0">"hello world".split() → ["hello","world"]</tspan></text></svg>