<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="280" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Наследование: иерархия классов</text><rect x="195" y="34" width="170" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="280" y="47" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="280" dy="0">Animal (базовый)</tspan><tspan x="280" dy="17">+ name, sound</tspan><tspan x="280" dy="17">+ speak()</tspan></text><path d="M 255 94 L 140 138" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M 280 94 L 280 138" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M 325 94 L 420 138" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><text x="175" y="120" text-anchor="middle" font-size="10" fill="#94a3b8">наследует</text><rect x="60" y="138" width="140" height="70" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="130" y="157" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="130" dy="0">Dog</tspan><tspan x="130" dy="16">+ breed</tspan><tspan x="130" dy="16">+ speak() → "Гав!"</tspan></text><rect x="210" y="138" width="140" height="70" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="280" y="157" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="280" dy="0">Cat</tspan><tspan x="280" dy="16">+ indoor</tspan><tspan x="280" dy="16">+ speak() → "Мяу!"</tspan></text><rect x="360" y="138" width="140" height="70" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="430" y="157" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="430" dy="0">Bird</tspan><tspan x="430" dy="16">+ can_fly</tspan><tspan x="430" dy="16">+ speak() → "Чирик!"</tspan></text><path d="M 130 208 L 130 252" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><rect x="60" y="252" width="140" height="44" rx="7" fill="#bbf7d0" stroke="#059669" stroke-width="1.5"/><text x="130" y="266" text-anchor="middle" font-size="11" fill="#064e3b" dominant-baseline="middle"><tspan x="130" dy="0">GuideDog(Dog)</tspan><tspan x="130" dy="16">+ owner</tspan></text><rect x="220" y="252" width="290" height="44" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="365" y="266" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="365" dy="0">Полиморфизм: for a in [Dog(),Cat(),Bird()]:</tspan><tspan x="365" dy="16">    a.speak()  → разный вывод!</tspan></text></svg>