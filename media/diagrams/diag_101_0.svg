<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 232" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Контекстный менеджер: протокол with</text><rect x="20" y="36" width="500" height="60" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="26" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">class FileManager:</tspan><tspan x="270" dy="16">    def __enter__(self):</tspan><tspan x="270" dy="16">        self.f = open(self.path)</tspan><tspan x="270" dy="16">        return self.f</tspan><tspan x="270" dy="16">    def __exit__(self, exc_type, exc_val, tb):</tspan><tspan x="270" dy="16">        self.f.close(); return False</tspan></text><text x="270" y="110" text-anchor="middle" font-size="12" fill="#334155">Проще через contextlib:</text><rect x="20" y="120" width="500" height="56" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="108" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">from contextlib import contextmanager</tspan><tspan x="270" dy="16">@contextmanager</tspan><tspan x="270" dy="16">def managed():</tspan><tspan x="270" dy="16">    resource = setup()   # __enter__</tspan><tspan x="270" dy="16">    try: yield resource</tspan><tspan x="270" dy="16">    finally: cleanup()   # __exit__</tspan></text><rect x="20" y="184" width="500" height="36" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="270" y="194" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="270" dy="0">with open("f.txt") as f:  — гарантирован close даже при исключении</tspan><tspan x="270" dy="16">with A() as a, B() as b:  — несколько менеджеров</tspan></text></svg>