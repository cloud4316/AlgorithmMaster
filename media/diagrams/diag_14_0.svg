<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 244" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">*args и **kwargs — переменное число аргументов</text><rect x="20" y="36" width="500" height="44" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="58" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">def func(a, b, *args, **kwargs):  # a,b — позиц. | *args — кортеж доп. | **kwargs — словарь</tspan></text><line x1="270" y1="80" x2="270" y2="104" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="20" y="104" width="235" height="44" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="118" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">func(1, 2, 3, 4, 5)</tspan><tspan x="137" dy="16">a=1, b=2, args=(3,4,5)</tspan></text><rect x="285" y="104" width="235" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="118" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">func(1,2, x=10,y=20)</tspan><tspan x="402" dy="16">kwargs={"x":10,"y":20}</tspan></text><text x="270" y="162" text-anchor="middle" font-size="12" fill="#334155">Замыкания (closures):</text><rect x="20" y="174" width="500" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="270" y="178" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="270" dy="0">def make_adder(n):</tspan><tspan x="270" dy="16">    def add(x): return x + n  # n захвачена из внешней области!</tspan><tspan x="270" dy="16">    return add</tspan><tspan x="270" dy="16">add5 = make_adder(5);  add5(3)  →  8</tspan></text></svg>