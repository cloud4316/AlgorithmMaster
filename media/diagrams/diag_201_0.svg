<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Уровни логирования Python</text><rect x="20" y="34" width="90" height="28" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="65" y="48" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="65" dy="0">DEBUG</tspan></text><text x="130" y="48" text-anchor="middle" font-size="11" fill="#475569">10</text><text x="250" y="48" text-anchor="start" font-size="11" fill="#334155">Подробный дебаг</text><rect x="20" y="68" width="90" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="65" y="82" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="65" dy="0">INFO</tspan></text><text x="130" y="82" text-anchor="middle" font-size="11" fill="#475569">20</text><text x="250" y="82" text-anchor="start" font-size="11" fill="#334155">Нормальная работа</text><rect x="20" y="102" width="90" height="28" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="65" y="116" text-anchor="middle" font-size="12" fill="#854d0e" dominant-baseline="middle"><tspan x="65" dy="0">WARNING</tspan></text><text x="130" y="116" text-anchor="middle" font-size="11" fill="#475569">30</text><text x="250" y="116" text-anchor="start" font-size="11" fill="#334155">Что-то необычное</text><rect x="20" y="136" width="90" height="28" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="65" y="150" text-anchor="middle" font-size="12" fill="#991b1b" dominant-baseline="middle"><tspan x="65" dy="0">ERROR</tspan></text><text x="130" y="150" text-anchor="middle" font-size="11" fill="#475569">40</text><text x="250" y="150" text-anchor="start" font-size="11" fill="#334155">Ошибка, программа работает</text><rect x="20" y="170" width="90" height="28" rx="5" fill="#fdf2f8" stroke="#9333ea" stroke-width="1.5"/><text x="65" y="184" text-anchor="middle" font-size="12" fill="#6b21a8" dominant-baseline="middle"><tspan x="65" dy="0">CRITICAL</tspan></text><text x="130" y="184" text-anchor="middle" font-size="11" fill="#475569">50</text><text x="250" y="184" text-anchor="start" font-size="11" fill="#334155">Критично, возможна остановка</text><rect x="20" y="206" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="216" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">import logging</tspan><tspan x="270" dy="16">logging.basicConfig(level=logging.DEBUG,format="%(asctime)s %(levelname)s %(message)s")</tspan></text><rect x="20" y="250" width="235" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="137" y="260" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0">logging.info("Сообщение")</tspan><tspan x="137" dy="16">logging.error("Ошибка",exc_info=True)</tspan></text><rect x="285" y="250" width="235" height="36" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/><text x="402" y="260" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="402" dy="0">logger=logging.getLogger(__name__)</tspan><tspan x="402" dy="16">FileHandler, StreamHandler</tspan></text></svg>