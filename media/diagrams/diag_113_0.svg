<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">BeautifulSoup: парсинг HTML</text><rect x="20" y="36" width="500" height="30" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="51" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">from bs4 import BeautifulSoup; soup=BeautifulSoup(html,"html.parser")</tspan></text><rect x="20" y="74" width="235" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="86" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">soup.find("a")  — первый тег</tspan><tspan x="137" dy="16">soup.find_all("p")  — все теги</tspan></text><rect x="285" y="74" width="235" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="86" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">soup.select("div.card a")  — CSS-селектор</tspan><tspan x="402" dy="16">soup.select_one("h1")  — первый</tspan></text><rect x="20" y="122" width="235" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="137" y="126" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">tag.text  — текст внутри тега</tspan><tspan x="137" dy="16">tag["href"]  — атрибут</tspan><tspan x="137" dy="16">tag.get("href","#")  — безопасно</tspan></text><rect x="285" y="122" width="235" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="402" y="126" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="402" dy="0">for tag in soup.find_all("a"):</tspan><tspan x="402" dy="16">    url=tag.get("href","")</tspan><tspan x="402" dy="16">    print(tag.text,url)</tspan></text><rect x="20" y="170" width="500" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="270" y="185" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="270" dy="0">Парсеры: "html.parser" (встроен) | "lxml" (быстрее) | "html5lib" (толерантный)</tspan></text><rect x="20" y="208" width="500" height="28" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="270" y="222" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="270" dy="0">requests.get(url).text → передать в BeautifulSoup для парсинга веб-страниц</tspan></text></svg>