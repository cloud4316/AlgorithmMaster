<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 234" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Генератор списка vs обычный цикл</text><rect x="20" y="36" width="230" height="110" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="135" y="91" text-anchor="middle" font-size="13" fill="#1e293b" dominant-baseline="middle"><tspan x="135" dy="0" /></text><text x="135" y="56" text-anchor="middle" font-size="12" fill="#991b1b">Обычный цикл (3 строки)</text><rect x="30" y="66" width="210" height="70" rx="5" fill="#fecaca" stroke="#ef4444" stroke-width="1.5" /><text x="135" y="77" text-anchor="middle" font-size="11" fill="#7f1d1d" dominant-baseline="middle"><tspan x="135" dy="0">result = []</tspan><tspan x="135" dy="16">for x in range(10):</tspan><tspan x="135" dy="16">    if x % 2 == 0:</tspan><tspan x="135" dy="16">        result.append(x**2)</tspan></text><path d="M 250 91 L 290 91" stroke="#64748b" stroke-width="2" marker-end="url(#ah)" /><text x="270" y="84" text-anchor="middle" font-size="10" fill="#475569">то же</text><rect x="290" y="36" width="230" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="405" y="91" text-anchor="middle" font-size="13" fill="#1e293b" dominant-baseline="middle"><tspan x="405" dy="0" /></text><text x="405" y="56" text-anchor="middle" font-size="12" fill="#15803d">List comprehension (1 строка)</text><rect x="300" y="66" width="210" height="80" rx="5" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5" /><text x="405" y="69" text-anchor="middle" font-size="11" fill="#14532d" dominant-baseline="middle"><tspan x="405" dy="0">result = [</tspan><tspan x="405" dy="16">  x**2</tspan><tspan x="405" dy="16">  for x in range(10)</tspan><tspan x="405" dy="16">  if x % 2 == 0</tspan><tspan x="405" dy="16">]</tspan></text><rect x="140" y="158" width="260" height="36" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" /><text x="270" y="176" text-anchor="middle" font-size="13" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">Результат: [0, 4, 16, 36, 64]</tspan></text><rect x="20" y="200" width="500" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" /><text x="270" y="212" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">[выражение  for переменная in итерируемое  if условие]</tspan></text></svg>