<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 242" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">functools: инструменты для функций</text><rect x="20" y="36" width="235" height="40" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="48" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">@lru_cache(maxsize=128)</tspan><tspan x="137" dy="17">Кэш результатов функции</tspan></text><rect x="285" y="36" width="235" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="48" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">@cache (Python 3.9+)</tspan><tspan x="402" dy="17">Неограниченный кэш</tspan></text><rect x="20" y="86" width="235" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="137" y="98" text-anchor="middle" font-size="12" fill="#4c1d95" dominant-baseline="middle"><tspan x="137" dy="0">partial(func, arg)</tspan><tspan x="137" dy="17">Фиксировать аргументы</tspan></text><rect x="285" y="86" width="235" height="40" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="402" y="98" text-anchor="middle" font-size="12" fill="#854d0e" dominant-baseline="middle"><tspan x="402" dy="0">reduce(f, iterable)</tspan><tspan x="402" dy="17">Свернуть в одно значение</tspan></text><rect x="20" y="136" width="500" height="44" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="150" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">@lru_cache</tspan><tspan x="270" dy="16">def fib(n): return n if n<2 else fib(n-1)+fib(n-2)  # fib(50) мгновенно!</tspan></text><rect x="20" y="188" width="500" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="270" y="200" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">add5 = partial(operator.add, 5)</tspan><tspan x="270" dy="16">add5(3)  →  8  |  add5(10)  →  15</tspan></text></svg>