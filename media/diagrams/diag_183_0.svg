<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 196" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Dict comprehension: анатомия</text><rect x="20" y="36" width="500" height="68" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="270" y="56" text-anchor="middle" font-size="13" fill="#4c1d95" dominant-baseline="middle"><tspan x="270" dy="0">{ключ: значение  for переменная in итерируемое  if условие}</tspan></text><text x="270" y="90" text-anchor="middle" font-size="12" fill="#334155">Примеры:</text><rect x="20" y="102" width="235" height="36" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="137" y="112" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">{x: x**2 for x in range(5)}</tspan><tspan x="137" dy="16">→ {0:0, 1:1, 2:4, 3:9, 4:16}</tspan></text><rect x="285" y="102" width="235" height="36" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="402" y="112" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">{w: len(w) for w in words}</tspan><tspan x="402" dy="16">→ {"abc":3, "hi":2}</tspan></text><rect x="20" y="146" width="235" height="36" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" /><text x="137" y="156" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">{k:v for k,v in d.items() if v&gt;0}</tspan><tspan x="137" dy="16">→ только положительные</tspan></text><rect x="285" y="146" width="235" height="36" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="402" y="156" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="402" dy="0">{v:k for k,v in d.items()}</tspan><tspan x="402" dy="16">→ инверсия словаря</tspan></text></svg>