<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 302" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="280" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Декоратор: @wraps оборачивает функцию</text><rect x="30" y="36" width="155" height="82" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="107" y="58" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="107" dy="0">def greet(name):</tspan><tspan x="107" dy="16">    return f"Привет, {name}"</tspan></text><text x="107" y="104" text-anchor="middle" font-size="10" fill="#64748b">оригинальная функция</text><line x1="107" y1="96" x2="107" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="none" /><path d="M 185 66 L 250 66" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)" /><text x="217" y="58" text-anchor="middle" font-size="11" fill="#7c3aed">@log_call</text><rect x="250" y="36" width="275" height="195" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="387" y="133" text-anchor="middle" font-size="13" fill="#1e293b" dominant-baseline="middle"><tspan x="387" dy="0" /></text><text x="387" y="56" text-anchor="middle" font-size="13" fill="#4c1d95">Декоратор log_call</text><rect x="260" y="66" width="255" height="40" rx="5" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5" /><text x="387" y="86" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="387" dy="0">def wrapper(*args, **kwargs):</tspan></text><rect x="260" y="114" width="255" height="34" rx="5" fill="#c4b5fd" stroke="#6d28d9" stroke-width="1.5" /><text x="387" y="131" text-anchor="middle" font-size="11" fill="#3730a3" dominant-baseline="middle"><tspan x="387" dy="0">print("Вызов до...")</tspan></text><rect x="260" y="154" width="255" height="34" rx="5" fill="#a78bfa" stroke="#6d28d9" stroke-width="1.5" /><text x="387" y="171" text-anchor="middle" font-size="11" fill="#3730a3" dominant-baseline="middle"><tspan x="387" dy="0">result = func(*args, **kwargs)</tspan></text><rect x="260" y="194" width="255" height="34" rx="5" fill="#c4b5fd" stroke="#6d28d9" stroke-width="1.5" /><text x="387" y="211" text-anchor="middle" font-size="11" fill="#3730a3" dominant-baseline="middle"><tspan x="387" dy="0">print("После")</tspan></text><path d="M 387 231 L 387 262" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)" /><rect x="250" y="262" width="275" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="387" y="277" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="387" dy="0">greet("Аня")  →  обёрнутый вызов</tspan></text><text x="107" y="155" text-anchor="middle" font-size="12" fill="#7c3aed">@log_call</text><text x="107" y="170" text-anchor="middle" font-size="11" fill="#0369a1">def greet(name):</text><text x="107" y="185" text-anchor="middle" font-size="11" fill="#475569">   ...</text><text x="107" y="208" text-anchor="middle" font-size="10" fill="#94a3b8">≡ greet = log_call(greet)</text></svg>