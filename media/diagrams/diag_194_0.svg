<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 222" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Pandas DataFrame: табличные данные</text><rect x="20" y="36" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="46" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">import pandas as pd</tspan><tspan x="270" dy="16">df=pd.read_csv("data.csv")  |  df=pd.DataFrame({"A":[1,2],"B":[3,4]})</tspan></text><rect x="20" y="80" width="235" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="86" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">Выбор:</tspan><tspan x="137" dy="16">df["col"]  — Series</tspan><tspan x="137" dy="16">df[["c1","c2"]]  — DataFrame</tspan></text><rect x="285" y="80" width="235" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="86" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">Фильтрация:</tspan><tspan x="402" dy="16">df[df["age"]>18]</tspan><tspan x="402" dy="16">df.query("age>18 and city=='MSK'")</tspan></text><rect x="20" y="132" width="235" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="137" y="144" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">df.groupby("city").agg({"sal":"mean"})</tspan><tspan x="137" dy="16">df.pivot_table()</tspan></text><rect x="285" y="132" width="235" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="402" y="136" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="402" dy="0">df.merge(df2,on="id",how="left")</tspan><tspan x="402" dy="16">df.join(df2)</tspan><tspan x="402" dy="16">pd.concat([df1,df2])</tspan></text><rect x="20" y="180" width="500" height="28" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="270" y="194" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="270" dy="0">df.info()  df.describe()  df.isna().sum()  df.dropna()  df.fillna(0)</tspan></text></svg>