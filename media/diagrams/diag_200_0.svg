<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="280" y="18" text-anchor="middle" font-size="14" fill="#1e293b">asyncio: Event Loop и корутины</text><rect x="185" y="34" width="190" height="46" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" /><text x="280" y="57" text-anchor="middle" font-size="14" fill="#e2e8f0" dominant-baseline="middle"><tspan x="280" dy="0">Event Loop</tspan></text><rect x="20" y="110" width="140" height="50" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="90" y="127" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="90" dy="0">Task 1</tspan><tspan x="90" dy="16">async def fetch(url)</tspan></text><rect x="200" y="110" width="140" height="50" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="270" y="127" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">Task 2</tspan><tspan x="270" dy="16">async def save(data)</tspan></text><rect x="380" y="110" width="140" height="50" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" /><text x="450" y="127" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="450" dy="0">Task 3</tspan><tspan x="450" dy="16">async def process()</tspan></text><path d="M 220 80 L 90 110" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ah)" /><path d="M 280 80 L 270 110" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ah)" /><path d="M 340 80 L 450 110" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#ah)" /><rect x="90" y="180" width="100" height="58" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="140" y="191" text-anchor="middle" font-size="10" fill="#991b1b" dominant-baseline="middle"><tspan x="140" dy="0">await IO</tspan><tspan x="140" dy="15">(ждёт ответа)</tspan></text><path d="M 90 160 L 90 180" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#ar)" stroke-dasharray="4,3" /><text x="90" y="224" text-anchor="middle" font-size="10" fill="#64748b">loop берёт другую
