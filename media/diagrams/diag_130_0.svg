<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">hashlib: хеширование и безопасные пароли</text><rect x="20" y="36" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="46" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">import hashlib</tspan><tspan x="270" dy="16">hashlib.sha256(b"text").hexdigest()  →  строка из 64 hex-символов</tspan></text><rect x="20" y="80" width="235" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="137" y="82" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="137" dy="0">MD5, SHA-1</tspan><tspan x="137" dy="16">НЕ для паролей! Взломаны.</tspan><tspan x="137" dy="16">Только для контрольных сумм.</tspan></text><rect x="285" y="80" width="235" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="82" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">SHA-256, SHA-3</tspan><tspan x="402" dy="16">Для файлов и данных.</tspan><tspan x="402" dy="16">Соврем. безопасные алгоритмы.</tspan></text><text x="270" y="130" text-anchor="middle" font-size="12" fill="#334155">Пароли — только через bcrypt/Argon2:</text><rect x="20" y="140" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="142" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">import bcrypt</tspan><tspan x="270" dy="16">hashed=bcrypt.hashpw(pwd.encode(),bcrypt.gensalt())</tspan><tspan x="270" dy="16">bcrypt.checkpw(pwd.encode(),hashed)</tspan></text><rect x="20" y="184" width="500" height="36" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="270" y="194" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="270" dy="0">Соль (salt) — случайные байты, добавляемые к паролю перед хешированием.</tspan><tspan x="270" dy="16">Защищает от rainbow-table атак.</tspan></text><rect x="20" y="228" width="235" height="28" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="242" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">HMAC: подпись сообщений</tspan></text><rect x="285" y="228" width="235" height="28" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="242" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">secrets.token_hex()  — крипто-случайность</tspan></text></svg>