<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 244" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Модуль datetime: работа с датой и временем</text><rect x="20" y="36" width="155" height="40" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="97" y="48" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">datetime.now()</tspan><tspan x="97" dy="16">текущий момент</tspan></text><rect x="193" y="36" width="155" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="48" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">timedelta(days=7)</tspan><tspan x="270" dy="16">арифметика дат</tspan></text><rect x="366" y="36" width="155" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="443" y="48" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="443" dy="0">strftime("%d.%m.%Y")</tspan><tspan x="443" dy="16">форматирование</tspan></text><rect x="20" y="86" width="235" height="44" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="137" y="100" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="137" dy="0">now=datetime.now()</tspan><tspan x="137" dy="16">now.strftime("%d.%m.%Y %H:%M")</tspan></text><rect x="285" y="86" width="235" height="44" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="402" y="100" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="402" dy="0">datetime.strptime("01.01.25","%d.%m.%y")</tspan><tspan x="402" dy="16">строка → объект datetime</tspan></text><text x="270" y="144" text-anchor="middle" font-size="12" fill="#334155">Часовые пояса (pytz / zoneinfo):</text><rect x="20" y="154" width="500" height="40" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="270" y="166" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="270" dy="0">from zoneinfo import ZoneInfo</tspan><tspan x="270" dy="16">now_msk=datetime.now(ZoneInfo("Europe/Moscow"))  # осознанная работа с TZ</tspan></text><rect x="20" y="202" width="235" height="28" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="137" y="216" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="137" dy="0">Наивная дата: без TZ</tspan></text><rect x="285" y="202" width="235" height="28" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="216" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">Осознанная дата: с TZ</tspan></text></svg>