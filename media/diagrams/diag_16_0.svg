<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="280" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Двумерный массив (матрица) 3×4</text><text x="62" y="38" text-anchor="middle" font-size="11" fill="#0369a1">[0]</text><text x="126" y="38" text-anchor="middle" font-size="11" fill="#0369a1">[1]</text><text x="190" y="38" text-anchor="middle" font-size="11" fill="#0369a1">[2]</text><text x="254" y="38" text-anchor="middle" font-size="11" fill="#0369a1">[3]</text><text x="12" y="72" text-anchor="middle" font-size="11" fill="#dc2626">[0]</text><rect x="30" y="50" width="61" height="41" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="60" y="62" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="60" dy="0">mat[0][0]</tspan><tspan x="60" dy="16">= 1</tspan></text><rect x="94" y="50" width="61" height="41" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="124" y="62" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="124" dy="0">mat[0][1]</tspan><tspan x="124" dy="16">= 2</tspan></text><rect x="158" y="50" width="61" height="41" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="188" y="62" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="188" dy="0">mat[0][2]</tspan><tspan x="188" dy="16">= 3</tspan></text><rect x="222" y="50" width="61" height="41" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="252" y="62" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="252" dy="0">mat[0][3]</tspan><tspan x="252" dy="16">= 4</tspan></text><text x="12" y="116" text-anchor="middle" font-size="11" fill="#dc2626">[1]</text><rect x="30" y="94" width="61" height="41" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="60" y="106" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="60" dy="0">mat[1][0]</tspan><tspan x="60" dy="16">= 5</tspan></text><rect x="94" y="94" width="61" height="41" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="124" y="106" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="124" dy="0">mat[1][1]</tspan><tspan x="124" dy="16">= 6</tspan></text><rect x="158" y="94" width="61" height="41" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="188" y="106" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="188" dy="0">mat[1][2]</tspan><tspan x="188" dy="16">= 7</tspan></text><rect x="222" y="94" width="61" height="41" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="252" y="106" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="252" dy="0">mat[1][3]</tspan><tspan x="252" dy="16">= 8</tspan></text><text x="12" y="160" text-anchor="middle" font-size="11" fill="#dc2626">[2]</text><rect x="30" y="138" width="61" height="41" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="60" y="150" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="60" dy="0">mat[2][0]</tspan><tspan x="60" dy="16">= 9</tspan></text><rect x="94" y="138" width="61" height="41" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="124" y="150" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="124" dy="0">mat[2][1]</tspan><tspan x="124" dy="16">= 10</tspan></text><rect x="158" y="138" width="61" height="41" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="188" y="150" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="188" dy="0">mat[2][2]</tspan><tspan x="188" dy="16">= 11</tspan></text><rect x="222" y="138" width="61" height="41" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="252" y="150" text-anchor="middle" font-size="11" fill="#1e293b" dominant-baseline="middle"><tspan x="252" dy="0">mat[2][3]</tspan><tspan x="252" dy="16">= 12</tspan></text><text x="30" y="202" text-anchor="start" font-size="12" fill="#475569">mat[строка][столбец]  →  mat[1][2] = 7</text><rect x="306" y="50" width="175" height="120" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="393" y="46" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="393" dy="0">mat = [</tspan><tspan x="393" dy="16">  [1,2,3,4],</tspan><tspan x="393" dy="16">  [5,6,7,8],</tspan><tspan x="393" dy="16">  [9,10,11,12]</tspan><tspan x="393" dy="16">]</tspan><tspan x="393" dy="16"></tspan><tspan x="393" dy="16">for row in mat:</tspan><tspan x="393" dy="16">  for v in row:</tspan><tspan x="393" dy="16">    print(v)</tspan></text></svg>