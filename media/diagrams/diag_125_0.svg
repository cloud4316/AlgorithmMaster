<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 222" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">matplotlib и seaborn: визуализация данных</text><rect x="20" y="36" width="155" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="97" y="46" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">plt.plot()</tspan><tspan x="97" dy="16">линейный график</tspan></text><rect x="193" y="36" width="155" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="46" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">plt.scatter()</tspan><tspan x="270" dy="16">точечная диаграмма</tspan></text><rect x="366" y="36" width="155" height="36" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="443" y="46" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="443" dy="0">plt.bar()</tspan><tspan x="443" dy="16">столбчатая диаграмма</tspan></text><rect x="20" y="80" width="155" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="97" y="90" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="97" dy="0">plt.hist()</tspan><tspan x="97" dy="16">гистограмма</tspan></text><rect x="193" y="80" width="155" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="270" y="90" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="270" dy="0">plt.pie()</tspan><tspan x="270" dy="16">круговая диаграмма</tspan></text><rect x="366" y="80" width="155" height="36" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="443" y="90" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="443" dy="0">plt.imshow()</tspan><tspan x="443" dy="16">изображение/тепловая карта</tspan></text><rect x="20" y="124" width="500" height="40" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="136" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">fig,ax=plt.subplots(1,2,figsize=(10,4))</tspan><tspan x="270" dy="16">ax[0].plot(x,y,label="данные");ax[0].set_xlabel("X");plt.legend();plt.show()</tspan></text><rect x="20" y="172" width="500" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="182" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">seaborn: sns.heatmap(corr)  |  sns.boxplot(data=df)  |  sns.pairplot(df)</tspan><tspan x="270" dy="16">Seaborn надстройка над matplotlib, красивее по умолчанию</tspan></text></svg>