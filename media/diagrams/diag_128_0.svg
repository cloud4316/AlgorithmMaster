<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Чистые функции и функциональная композиция</text><rect x="20" y="36" width="235" height="62" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="137" y="37" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0">Чистая функция:</tspan><tspan x="137" dy="16">- нет побочных эффектов</tspan><tspan x="137" dy="16">- тот же вход → тот же выход</tspan><tspan x="137" dy="16">def add(a,b): return a+b</tspan></text><rect x="285" y="36" width="235" height="62" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="402" y="37" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="402" dy="0">Нечистая функция:</tspan><tspan x="402" dy="16">читает/пишет глобальную переменную</tspan><tspan x="402" dy="16">print(), random(), datetime.now()</tspan><tspan x="402" dy="16">меняет входные данные!</tspan></text><text x="270" y="102" text-anchor="middle" font-size="12" fill="#334155">map / filter / reduce:</text><rect x="20" y="112" width="155" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="97" y="122" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">list(map(str,nums))</tspan><tspan x="97" dy="16">→ ["1","2","3"]</tspan></text><rect x="193" y="112" width="155" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="270" y="122" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="270" dy="0">list(filter(bool,lst))</tspan><tspan x="270" dy="16">→ убрать Falsy</tspan></text><rect x="366" y="112" width="155" height="36" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" /><text x="443" y="122" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="443" dy="0">reduce(lambda a,b:a+b,[1,2,3])</tspan><tspan x="443" dy="16">→ 6</tspan></text><text x="270" y="162" text-anchor="middle" font-size="12" fill="#334155">Композиция функций:</text><rect x="20" y="172" width="500" height="58" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" /><text x="270" y="168" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">from functools import reduce</tspan><tspan x="270" dy="16">compose=lambda *fs: reduce(lambda f,g: lambda x: f(g(x)),fs)</tspan><tspan x="270" dy="16">upperstrip=compose(str.upper,str.strip)</tspan><tspan x="270" dy="16">upperstrip("  hello  ")  →  "HELLO"</tspan></text></svg>