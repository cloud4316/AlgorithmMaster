<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 232" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Файловый ввод-вывод: open() и режимы</text><rect x="20" y="36" width="500" height="44" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="58" text-anchor="middle" font-size="13" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">with open("file.txt", mode, encoding="utf-8") as f:</tspan></text><rect x="20" y="90" width="105" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="72" y="99" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="72" dy="0">"r"</tspan><tspan x="72" dy="16">чтение</tspan></text><rect x="133" y="90" width="105" height="34" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="185" y="99" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="185" dy="0">"w"</tspan><tspan x="185" dy="16">запись</tspan></text><rect x="246" y="90" width="105" height="34" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="298" y="99" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="298" dy="0">"a"</tspan><tspan x="298" dy="16">добавить</tspan></text><rect x="359" y="90" width="75" height="34" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="396" y="99" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="396" dy="0">"rb"</tspan><tspan x="396" dy="16">бинарный</tspan></text><rect x="442" y="90" width="78" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="481" y="99" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="481" dy="0">"r+"</tspan><tspan x="481" dy="16">чит+зап</tspan></text><rect x="20" y="134" width="235" height="56" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="137" y="146" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0">f.read()  → вся строка</tspan><tspan x="137" dy="16">f.readlines()  → список строк</tspan><tspan x="137" dy="16">for line in f:  → построчно</tspan></text><rect x="285" y="134" width="235" height="56" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/><text x="402" y="146" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="402" dy="0">f.write("текст")</tspan><tspan x="402" dy="16">f.writelines(lst)</tspan><tspan x="402" dy="16">print("...", file=f)</tspan></text><rect x="20" y="198" width="500" height="22" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="270" y="209" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="270" dy="0">with — гарантирует закрытие файла даже при ошибке (контекстный менеджер)</tspan></text></svg>