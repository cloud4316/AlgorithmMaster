<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ahr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><rect x="20" y="30" width="210" height="240" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="125" y="150" text-anchor="middle" font-size="13" fill="#1e293b" dominant-baseline="middle"><tspan x="125" dy="0"></tspan></text><text x="125" y="52" text-anchor="middle" font-size="13" fill="#4c1d95">class Student:</text><rect x="30" y="62" width="190" height="38" rx="5" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/><text x="125" y="81" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="125" dy="0">__init__(self, name, grade)</tspan></text><rect x="30" y="108" width="190" height="30" rx="5" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/><text x="125" y="123" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="125" dy="0">self.name = name</tspan></text><rect x="30" y="146" width="190" height="30" rx="5" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/><text x="125" y="161" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="125" dy="0">self.grade = grade</tspan></text><rect x="30" y="190" width="190" height="30" rx="5" fill="#c4b5fd" stroke="#6d28d9" stroke-width="1.5"/><text x="125" y="205" text-anchor="middle" font-size="11" fill="#3730a3" dominant-baseline="middle"><tspan x="125" dy="0">def greet(self): ...</tspan></text><rect x="30" y="228" width="190" height="30" rx="5" fill="#c4b5fd" stroke="#6d28d9" stroke-width="1.5"/><text x="125" y="243" text-anchor="middle" font-size="11" fill="#3730a3" dominant-baseline="middle"><tspan x="125" dy="0">def study(self): ...</tspan></text><text x="125" y="278" text-anchor="middle" font-size="12" fill="#7c3aed">Шаблон (Blueprint)</text><path d="M 230 150 L 290 150" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><text x="260" y="143" text-anchor="middle" font-size="11" fill="#64748b">создаёт</text><rect x="295" y="30" width="130" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="360" y="90" text-anchor="middle" font-size="13" fill="#1e293b" dominant-baseline="middle"><tspan x="360" dy="0"></tspan></text><text x="360" y="50" text-anchor="middle" font-size="12" fill="#15803d">s1 (объект)</text><rect x="305" y="60" width="110" height="26" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="360" y="73" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="360" dy="0">name = "Аня"</tspan></text><rect x="305" y="92" width="110" height="26" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="360" y="105" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="360" dy="0">grade = 5</tspan></text><rect x="305" y="124" width="110" height="20" rx="4" fill="#86efac" stroke="#15803d" stroke-width="1.5"/><text x="360" y="134" text-anchor="middle" font-size="10" fill="#14532d" dominant-baseline="middle"><tspan x="360" dy="0">greet(), study()</tspan></text><rect x="440" y="30" width="130" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="505" y="90" text-anchor="middle" font-size="13" fill="#1e293b" dominant-baseline="middle"><tspan x="505" dy="0"></tspan></text><text x="505" y="50" text-anchor="middle" font-size="12" fill="#9a3412">s2 (объект)</text><rect x="450" y="60" width="110" height="26" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/><text x="505" y="73" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="505" dy="0">name = "Вася"</tspan></text><rect x="450" y="92" width="110" height="26" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/><text x="505" y="105" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="505" dy="0">grade = 4</tspan></text><rect x="450" y="124" width="110" height="20" rx="4" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><text x="505" y="134" text-anchor="middle" font-size="10" fill="#7c2d12" dominant-baseline="middle"><tspan x="505" dy="0">greet(), study()</tspan></text><path d="M 230 150 L 290 150" stroke="#64748b" stroke-width="2"/><rect x="295" y="168" width="275" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="432" y="182" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="432" dy="0">s1 = Student("Аня", 5)</tspan><tspan x="432" dy="16">s2 = Student("Вася", 4)</tspan><tspan x="432" dy="16">s1.greet()</tspan></text><text x="432" y="246" text-anchor="middle" font-size="10" fill="#64748b">Student() → вызывает __init__ → создаёт объект</text></svg>