<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 204" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="280" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Частые ловушки Python — запомни!</text><rect x="20" y="34" width="250" height="44" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="145" y="48" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="145" dy="0">x = y = []  # один объект!</tspan><tspan x="145" dy="16">x.append(1)  # y тоже [1]!</tspan></text><rect x="290" y="34" width="250" height="44" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="415" y="48" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="415" dy="0">def f(lst=[]):  # дефолт создаётся раз!</tspan><tspan x="415" dy="16">    lst.append(1)  # накапливается!</tspan></text><rect x="20" y="90" width="250" height="44" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="145" y="104" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="145" dy="0">0.1 + 0.2 != 0.3  # float неточность</tspan><tspan x="145" dy="16">Используй: round() или decimal</tspan></text><rect x="290" y="90" width="250" height="44" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="415" y="96" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="415" dy="0">i = 0</tspan><tspan x="415" dy="16">for i in range(5): pass</tspan><tspan x="415" dy="16">print(i)  # 4, не ошибка!</tspan></text><rect x="20" y="146" width="250" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="145" y="160" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="145" dy="0">"==" vs "is": == значение</tspan><tspan x="145" dy="16">is — тот же объект в памяти</tspan></text><rect x="290" y="146" width="250" height="44" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="415" y="160" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="415" dy="0">a=[1,2,3]; b=a  # b — псевдоним!</tspan><tspan x="415" dy="16">b=a[:]  или  b=a.copy()  — копия</tspan></text></svg>