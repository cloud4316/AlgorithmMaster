<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 226" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">JSON: сериализация и десериализация</text><rect x="20" y="36" width="235" height="80" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="137" y="68" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="137" dy="0">Python объект:</tspan><tspan x="137" dy="16">{"name":"Анна","age":25,"tags":["py","ml"]}</tspan></text><line x1="255" y1="76" x2="285" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/><text x="270" y="68" text-anchor="middle" font-size="10" fill="#475569">json.dumps()</text><text x="270" y="84" text-anchor="middle" font-size="10" fill="#475569">json.loads()</text><rect x="305" y="36" width="235" height="80" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="422" y="68" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="422" dy="0">JSON строка:</tspan><tspan x="422" dy="16">'{"name":"Анна","age":25,"tags":["py","ml"]}'</tspan></text><line x1="255" y1="84" x2="285" y2="84" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="20" y="128" width="235" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="140" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">json.dump(obj,file)</tspan><tspan x="137" dy="16">записать в файл</tspan></text><rect x="285" y="128" width="235" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="140" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">json.load(file)</tspan><tspan x="402" dy="16">прочитать из файла</tspan></text><rect x="20" y="176" width="500" height="36" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="270" y="186" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="270" dy="0">indent=4: красивый вывод | ensure_ascii=False: сохранить кириллицу</tspan><tspan x="270" dy="16">dict/list/str/int/float/bool/None  ↔  JSON объект/массив/строка/число/bool/null</tspan></text></svg>