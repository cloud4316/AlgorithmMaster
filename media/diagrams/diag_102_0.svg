<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 194" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Порождающие паттерны (Creational)</text><rect x="20" y="36" width="155" height="44" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="97" y="50" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">Singleton</tspan><tspan x="97" dy="16">Один экземпляр класса</tspan></text><rect x="193" y="36" width="155" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="50" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">Factory Method</tspan><tspan x="270" dy="16">Создание без указания класса</tspan></text><rect x="366" y="36" width="155" height="44" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="443" y="50" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="443" dy="0">Abstract Factory</tspan><tspan x="443" dy="16">Семейства объектов</tspan></text><rect x="20" y="90" width="155" height="44" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="97" y="104" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="97" dy="0">Builder</tspan><tspan x="97" dy="16">Пошаговое построение объекта</tspan></text><rect x="193" y="90" width="155" height="44" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="270" y="104" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="270" dy="0">Prototype</tspan><tspan x="270" dy="16">Клонирование объекта</tspan></text><rect x="366" y="90" width="155" height="44" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="443" y="104" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="443" dy="0">Pool / Borg</tspan><tspan x="443" dy="16">Совместное состояние</tspan></text><rect x="20" y="144" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="146" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">class Singleton:</tspan><tspan x="270" dy="16">    _instance=None</tspan><tspan x="270" dy="16">    def __new__(cls): cls._instance = cls._instance or super().__new__(cls); return cls._instance</tspan></text></svg>