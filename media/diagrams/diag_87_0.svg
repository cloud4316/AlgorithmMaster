<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 244" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Dunder-методы: магия Python</text><rect x="20" y="36" width="155" height="34" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="97" y="53" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">__init__  создание</tspan></text><rect x="193" y="36" width="155" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="53" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">__repr__  отладка</tspan></text><rect x="366" y="36" width="155" height="34" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="443" y="53" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="443" dy="0">__str__  строка</tspan></text><rect x="20" y="78" width="155" height="34" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="97" y="95" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="97" dy="0">__len__  len(obj)</tspan></text><rect x="193" y="78" width="155" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="270" y="95" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="270" dy="0">__eq__  ==</tspan></text><rect x="366" y="78" width="155" height="34" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="443" y="95" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="443" dy="0">__lt__  &lt;</tspan></text><rect x="20" y="120" width="155" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="97" y="137" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="97" dy="0">__add__  +</tspan></text><rect x="193" y="120" width="155" height="34" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="270" y="137" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="270" dy="0">__getitem__  []</tspan></text><rect x="366" y="120" width="155" height="34" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="443" y="137" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="443" dy="0">__iter__  for</tspan></text><rect x="20" y="162" width="155" height="34" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="97" y="171" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="97" dy="0">__enter__/__exit__</tspan><tspan x="97" dy="16">with блок</tspan></text><rect x="193" y="162" width="155" height="34" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="270" y="179" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="270" dy="0">__call__  obj()</tspan></text><rect x="366" y="162" width="155" height="34" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="443" y="179" text-anchor="middle" font-size="11" fill="#475569" dominant-baseline="middle"><tspan x="443" dy="0">__del__  удаление</tspan></text><rect x="20" y="204" width="500" height="28" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="218" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">@functools.total_ordering: определи __eq__ и __lt__, остальные сравнения получишь бесплатно</tspan></text></svg>