<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 256" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">@property: инкапсуляция атрибутов</text><rect x="20" y="36" width="500" height="60" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="42" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">class Circle:</tspan><tspan x="270" dy="16">    def __init__(self,r): self._r=r</tspan><tspan x="270" dy="16">    @property</tspan><tspan x="270" dy="16">    def radius(self): return self._r        # геттер</tspan></text><rect x="20" y="104" width="500" height="60" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="110" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">    @radius.setter</tspan><tspan x="270" dy="16">    def radius(self,v):</tspan><tspan x="270" dy="16">        if v<0: raise ValueError("Радиус > 0!")</tspan><tspan x="270" dy="16">        self._r=v                             # сеттер</tspan></text><rect x="20" y="172" width="235" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="174" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">c=Circle(5)</tspan><tspan x="137" dy="16">c.radius  →  5</tspan><tspan x="137" dy="16">c.radius=10  →  OK</tspan></text><rect x="285" y="172" width="235" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="402" y="174" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="402" dy="0">c.radius=-1</tspan><tspan x="402" dy="16">→ ValueError</tspan><tspan x="402" dy="16">(валидация в сеттере)</tspan></text><rect x="20" y="216" width="500" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="230" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">_attr  — соглашение: "внутренний" | __attr — name mangling: _Class__attr</tspan></text></svg>