<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 222" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">argparse: аргументы командной строки</text><rect x="20" y="36" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="46" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">import argparse</tspan><tspan x="270" dy="16">parser=argparse.ArgumentParser(description="Описание программы")</tspan></text><rect x="20" y="80" width="235" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="86" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">Позиционный аргумент:</tspan><tspan x="137" dy="16">parser.add_argument("filename")</tspan><tspan x="137" dy="16">args.filename</tspan></text><rect x="285" y="80" width="235" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="86" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">Ключевой аргумент:</tspan><tspan x="402" dy="16">parser.add_argument("--count",type=int,default=1)</tspan><tspan x="402" dy="16">args.count</tspan></text><rect x="20" y="132" width="235" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="137" y="136" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">Флаг (bool):</tspan><tspan x="137" dy="16">parser.add_argument("--verbose","-v",</tspan><tspan x="137" dy="16">action="store_true")</tspan></text><rect x="285" y="132" width="235" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="402" y="136" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="402" dy="0">Запуск:</tspan><tspan x="402" dy="16">python prog.py file.txt --count=5 -v</tspan><tspan x="402" dy="16">args=parser.parse_args()</tspan></text><rect x="20" y="180" width="500" height="28" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="270" y="194" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="270" dy="0">parser.parse_known_args()  — игнорировать неизвестные | subparsers — подкоманды (git commit, git push...)</tspan></text></svg>