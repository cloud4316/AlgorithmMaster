<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 256" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Аннотации типов Python</text><text x="90" y="34" text-anchor="middle" font-size="11" fill="#334155">Тип</text><text x="230" y="34" text-anchor="middle" font-size="11" fill="#334155">Описание</text><text x="400" y="34" text-anchor="middle" font-size="11" fill="#334155">Пример</text><rect x="20" y="44" width="140" height="24" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="90" y="56" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="90" dy="0">int</tspan></text><text x="230" y="56" text-anchor="middle" font-size="11" fill="#475569">целое число</text><text x="400" y="56" text-anchor="middle" font-size="11" fill="#334155">count: int = 0</text><rect x="20" y="72" width="140" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="90" y="84" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="90" dy="0">str</tspan></text><text x="230" y="84" text-anchor="middle" font-size="11" fill="#475569">строка</text><text x="400" y="84" text-anchor="middle" font-size="11" fill="#334155">name: str</text><rect x="20" y="100" width="140" height="24" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="90" y="112" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="90" dy="0">list[int]</tspan></text><text x="230" y="112" text-anchor="middle" font-size="11" fill="#475569">список целых</text><text x="400" y="112" text-anchor="middle" font-size="11" fill="#334155">scores: list[int]</text><rect x="20" y="128" width="140" height="24" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="90" y="140" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="90" dy="0">dict[str,Any]</tspan></text><text x="230" y="140" text-anchor="middle" font-size="11" fill="#475569">словарь</text><text x="400" y="140" text-anchor="middle" font-size="11" fill="#334155">data: dict[str, Any]</text><rect x="20" y="156" width="140" height="24" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="90" y="168" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="90" dy="0">Optional[str]</tspan></text><text x="230" y="168" text-anchor="middle" font-size="11" fill="#475569">или None</text><text x="400" y="168" text-anchor="middle" font-size="11" fill="#334155">result: Optional[str]</text><rect x="20" y="184" width="140" height="24" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="90" y="196" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="90" dy="0">Union[int,str]</tspan></text><text x="230" y="196" text-anchor="middle" font-size="11" fill="#475569">int или str</text><text x="400" y="196" text-anchor="middle" font-size="11" fill="#334155">val: Union[int,str]</text><rect x="20" y="216" width="500" height="28" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="270" y="230" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="270" dy="0">mypy / pyright: проверяют типы статически. В рантайме аннотации не влияют на код!</tspan></text></svg>