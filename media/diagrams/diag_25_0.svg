<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 346" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="260" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Рекурсия: базовый случай и индуктивный шаг</text><rect x="160" y="36" width="200" height="40" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="260" y="56" text-anchor="middle" font-size="13" fill="#0369a1" dominant-baseline="middle"><tspan x="260" dy="0">fib(5)  Вызов</tspan></text><line x1="260" y1="76" x2="260" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="160" y="114" width="200" height="36" rx="7" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/><text x="260" y="132" text-anchor="middle" font-size="12" fill="#4c1d95" dominant-baseline="middle"><tspan x="260" dy="0">fib(4) + fib(3)</tspan></text><line x1="260" y1="150" x2="260" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="160" y="186" width="200" height="36" rx="7" fill="#c4b5fd" stroke="#6d28d9" stroke-width="1.5"/><text x="260" y="204" text-anchor="middle" font-size="11" fill="#3730a3" dominant-baseline="middle"><tspan x="260" dy="0">fib(3)+fib(2)  |  fib(2)+fib(1)</tspan></text><line x1="260" y1="222" x2="260" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="160" y="258" width="200" height="36" rx="7" fill="#a78bfa" stroke="#6d28d9" stroke-width="1.5"/><text x="260" y="276" text-anchor="middle" font-size="11" fill="#2e1065" dominant-baseline="middle"><tspan x="260" dy="0">fib(2)+fib(1)  |  fib(1)  |  fib(0)+fib(1)</tspan></text><rect x="80" y="296" width="170" height="36" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="165" y="314" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="165" dy="0">fib(1)=1  fib(0)=0</tspan></text><rect x="270" y="296" width="170" height="36" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="355" y="314" text-anchor="middle" font-size="13" fill="#15803d" dominant-baseline="middle"><tspan x="355" dy="0">БАЗА — возвращаем</tspan></text><rect x="20" y="36" width="130" height="44" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="85" y="50" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="85" dy="0">Без базы:</tspan><tspan x="85" dy="16">bесконечность!</tspan></text><text x="75" y="88" text-anchor="middle" font-size="10" fill="#dc2626">RecursionError</text></svg>