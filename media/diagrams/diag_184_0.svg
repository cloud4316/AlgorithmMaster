<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 242" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Декоратор с параметрами: фабрика декораторов</text><rect x="20" y="36" width="500" height="98" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" /><text x="270" y="31" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">def repeat(n):           # фабрика декораторов</tspan><tspan x="270" dy="16">    def decorator(func):  # сам декоратор</tspan><tspan x="270" dy="16">        def wrapper(*a,**kw):</tspan><tspan x="270" dy="16">            for _ in range(n): func(*a,**kw)</tspan><tspan x="270" dy="16">        return wrapper</tspan><tspan x="270" dy="16">    return decorator</tspan></text><text x="270" y="120" text-anchor="middle" font-size="12" fill="#334155">Использование:</text><rect x="20" y="132" width="235" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="137" y="138" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="137" dy="0">@repeat(3)</tspan><tspan x="137" dy="16">def say_hi(): print("Привет!")</tspan><tspan x="137" dy="16">say_hi()  # "Привет!" × 3</tspan></text><rect x="285" y="132" width="235" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="402" y="138" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="402" dy="0">functools.wraps(func)</tspan><tspan x="402" dy="16">→ сохраняет __name__,</tspan><tspan x="402" dy="16">__doc__ оригинала</tspan></text><rect x="20" y="184" width="500" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="270" y="198" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">Стек: @repeat(3) → repeat(3) возвращает decorator → decorator(say_hi) → wrapper</tspan><tspan x="270" dy="16">Вложенность: @a @b def f()  ≡  f = a(b(f))</tspan></text></svg>