<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Протокол итератора в Python</text><rect x="20" y="36" width="150" height="56" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="95" y="56" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="95" dy="0">Iterable</tspan><tspan x="95" dy="17">(list, range, str)</tspan></text><line x1="170" y1="64" x2="220" y2="64" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)" /><text x="195" y="56" text-anchor="middle" font-size="10" fill="#475569">iter()</text><rect x="220" y="36" width="150" height="56" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="295" y="56" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="295" dy="0">Iterator</tspan><tspan x="295" dy="17">(хранит позицию)</tspan></text><line x1="370" y1="64" x2="420" y2="64" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)" /><text x="395" y="56" text-anchor="middle" font-size="10" fill="#475569">next()</text><rect x="420" y="36" width="100" height="56" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="470" y="56" text-anchor="middle" font-size="12" fill="#854d0e" dominant-baseline="middle"><tspan x="470" dy="0">Значения</tspan><tspan x="470" dy="17">по одному</tspan></text><line x1="470" y1="92" x2="470" y2="132" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ah)" /><rect x="390" y="132" width="130" height="36" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="455" y="150" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="455" dy="0">StopIteration</tspan></text><rect x="20" y="120" width="340" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="190" y="132" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="190" dy="0">for x in iterable:</tspan><tspan x="190" dy="16">    # Python сам вызывает iter() и next()</tspan><tspan x="190" dy="16">    # StopIteration -> выход</tspan></text><rect x="20" y="192" width="500" height="64" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="270" y="192" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">class Counter:</tspan><tspan x="270" dy="16">    def __iter__(self): self.n=0; return self</tspan><tspan x="270" dy="16">    def __next__(self):</tspan><tspan x="270" dy="16">        if self.n>=5: raise StopIteration</tspan><tspan x="270" dy="16">        self.n+=1; return self.n</tspan></text></svg>