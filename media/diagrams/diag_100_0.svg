<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">dataclasses: удобные классы данных</text><rect x="20" y="36" width="500" height="60" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="26" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">from dataclasses import dataclass, field</tspan><tspan x="270" dy="16">@dataclass</tspan><tspan x="270" dy="16">class Point:</tspan><tspan x="270" dy="16">    x: float</tspan><tspan x="270" dy="16">    y: float = 0.0</tspan><tspan x="270" dy="16">    tags: list = field(default_factory=list)</tspan></text><text x="270" y="110" text-anchor="middle" font-size="12" fill="#334155">Автоматически генерируются:</text><rect x="20" y="120" width="115" height="30" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="77" y="135" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="77" dy="0">__init__</tspan></text><rect x="143" y="120" width="115" height="30" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="200" y="135" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="200" dy="0">__repr__</tspan></text><rect x="266" y="120" width="115" height="30" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="323" y="135" text-anchor="middle" font-size="12" fill="#4c1d95" dominant-baseline="middle"><tspan x="323" dy="0">__eq__</tspan></text><rect x="389" y="120" width="115" height="30" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="446" y="135" text-anchor="middle" font-size="12" fill="#854d0e" dominant-baseline="middle"><tspan x="446" dy="0">__hash__</tspan></text><rect x="20" y="158" width="235" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="137" y="169" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0">@dataclass(frozen=True)</tspan><tspan x="137" dy="16">неизменяемый + hashable</tspan></text><rect x="285" y="158" width="235" height="38" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/><text x="402" y="169" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="402" dy="0">@dataclass(order=True)</tspan><tspan x="402" dy="16">добавляет &lt;, &gt;, &lt;=, &gt;=</tspan></text></svg>