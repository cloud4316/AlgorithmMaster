<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 206" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Поведенческие паттерны (Behavioral)</text><rect x="20" y="36" width="155" height="40" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="97" y="48" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">Observer</tspan><tspan x="97" dy="16">Подписка на события</tspan></text><rect x="193" y="36" width="155" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="270" y="48" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">Strategy</tspan><tspan x="270" dy="16">Сменная стратегия</tspan></text><rect x="366" y="36" width="155" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="443" y="48" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="443" dy="0">Command</tspan><tspan x="443" dy="16">Заключить действие в объект</tspan></text><rect x="20" y="84" width="155" height="40" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" /><text x="97" y="96" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="97" dy="0">Template Method</tspan><tspan x="97" dy="16">Очерёдность шагов</tspan></text><rect x="193" y="84" width="155" height="40" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" /><text x="270" y="96" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="270" dy="0">Iterator</tspan><tspan x="270" dy="16">Обход коллекции</tspan></text><rect x="366" y="84" width="155" height="40" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" /><text x="443" y="96" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="443" dy="0">Decorator</tspan><tspan x="443" dy="16">Добавить поведение</tspan></text><rect x="20" y="132" width="235" height="64" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" /><text x="137" y="134" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0"># Strategy</tspan><tspan x="137" dy="16">class Sorter:</tspan><tspan x="137" dy="16">  def __init__(self,s): self.s=s</tspan><tspan x="137" dy="16">  def sort(self,d): return self.s(d)</tspan></text><rect x="285" y="132" width="235" height="64" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5" /><text x="402" y="134" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="402" dy="0"># Observer</tspan><tspan x="402" dy="16">class Event:</tspan><tspan x="402" dy="16">  def __init__(self): self._h=[]</tspan><tspan x="402" dy="16">  def subscribe(self,h): self._h.append(h)</tspan></text></svg>