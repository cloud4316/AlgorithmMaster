<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Три формы range()</text><rect x="20" y="34" width="155" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="97" y="62" text-anchor="middle" font-size="14" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">range(5)</tspan></text><text x="97" y="98" text-anchor="middle" font-size="10" fill="#475569">stop=5, start=0, step=1</text><rect x="20" y="108" width="28" height="32" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/><text x="34" y="124" text-anchor="middle" font-size="13" fill="#1e3a5f" dominant-baseline="middle"><tspan x="34" dy="0">0</tspan></text><rect x="51" y="108" width="28" height="32" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/><text x="65" y="124" text-anchor="middle" font-size="13" fill="#1e3a5f" dominant-baseline="middle"><tspan x="65" dy="0">1</tspan></text><rect x="82" y="108" width="28" height="32" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/><text x="96" y="124" text-anchor="middle" font-size="13" fill="#1e3a5f" dominant-baseline="middle"><tspan x="96" dy="0">2</tspan></text><rect x="113" y="108" width="28" height="32" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/><text x="127" y="124" text-anchor="middle" font-size="13" fill="#1e3a5f" dominant-baseline="middle"><tspan x="127" dy="0">3</tspan></text><rect x="144" y="108" width="28" height="32" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/><text x="158" y="124" text-anchor="middle" font-size="13" fill="#1e3a5f" dominant-baseline="middle"><tspan x="158" dy="0">4</tspan></text><text x="97" y="150" text-anchor="middle" font-size="12" fill="#0369a1">[0, 1, 2, 3, 4]</text><rect x="195" y="34" width="155" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="272" y="62" text-anchor="middle" font-size="14" fill="#15803d" dominant-baseline="middle"><tspan x="272" dy="0">range(2, 8)</tspan></text><text x="272" y="98" text-anchor="middle" font-size="10" fill="#475569">start=2, stop=8, step=1</text><rect x="195" y="108" width="28" height="32" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/><text x="209" y="124" text-anchor="middle" font-size="13" fill="#14532d" dominant-baseline="middle"><tspan x="209" dy="0">2</tspan></text><rect x="226" y="108" width="28" height="32" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/><text x="240" y="124" text-anchor="middle" font-size="13" fill="#14532d" dominant-baseline="middle"><tspan x="240" dy="0">3</tspan></text><rect x="257" y="108" width="28" height="32" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/><text x="271" y="124" text-anchor="middle" font-size="13" fill="#14532d" dominant-baseline="middle"><tspan x="271" dy="0">4</tspan></text><rect x="288" y="108" width="28" height="32" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/><text x="302" y="124" text-anchor="middle" font-size="13" fill="#14532d" dominant-baseline="middle"><tspan x="302" dy="0">5</tspan></text><rect x="319" y="108" width="28" height="32" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/><text x="333" y="124" text-anchor="middle" font-size="13" fill="#14532d" dominant-baseline="middle"><tspan x="333" dy="0">6</tspan></text><rect x="350" y="108" width="28" height="32" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/><text x="364" y="124" text-anchor="middle" font-size="13" fill="#14532d" dominant-baseline="middle"><tspan x="364" dy="0">7</tspan></text><text x="272" y="150" text-anchor="middle" font-size="12" fill="#15803d">[2, 3, 4, 5, 6, 7]</text><rect x="370" y="34" width="155" height="56" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="447" y="62" text-anchor="middle" font-size="13" fill="#854d0e" dominant-baseline="middle"><tspan x="447" dy="0">range(0, 10, 2)</tspan></text><text x="447" y="98" text-anchor="middle" font-size="10" fill="#475569">start=0, stop=10, step=2</text><rect x="370" y="108" width="28" height="32" rx="8" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/><text x="384" y="124" text-anchor="middle" font-size="13" fill="#713f12" dominant-baseline="middle"><tspan x="384" dy="0">0</tspan></text><rect x="401" y="108" width="28" height="32" rx="8" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/><text x="415" y="124" text-anchor="middle" font-size="13" fill="#713f12" dominant-baseline="middle"><tspan x="415" dy="0">2</tspan></text><rect x="432" y="108" width="28" height="32" rx="8" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/><text x="446" y="124" text-anchor="middle" font-size="13" fill="#713f12" dominant-baseline="middle"><tspan x="446" dy="0">4</tspan></text><rect x="463" y="108" width="28" height="32" rx="8" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/><text x="477" y="124" text-anchor="middle" font-size="13" fill="#713f12" dominant-baseline="middle"><tspan x="477" dy="0">6</tspan></text><rect x="494" y="108" width="28" height="32" rx="8" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/><text x="508" y="124" text-anchor="middle" font-size="13" fill="#713f12" dominant-baseline="middle"><tspan x="508" dy="0">8</tspan></text><text x="447" y="150" text-anchor="middle" font-size="12" fill="#854d0e">[0, 2, 4, 6, 8]</text><rect x="20" y="168" width="500" height="68" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="270" y="185" text-anchor="middle" font-size="12" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">range НЕ хранит список в памяти — он генерирует числа по требованию.</tspan><tspan x="270" dy="17">range(1_000_000) занимает столько же памяти, что и range(5).</tspan><tspan x="270" dy="17">Для получения списка: list(range(5)) → [0, 1, 2, 3, 4]</tspan></text></svg>