<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Генераторы: yield — ленивые вычисления</text><rect x="20" y="36" width="235" height="56" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="137" y="48" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="137" dy="0">Список: хранит ВСЁ в памяти</tspan><tspan x="137" dy="16">[x**2 for x in range(1000000)]</tspan><tspan x="137" dy="16">→ 8 МБ RAM</tspan></text><rect x="285" y="36" width="235" height="56" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="48" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">Генератор: выдаёт по одному</tspan><tspan x="402" dy="16">(x**2 for x in range(1000000))</tspan><tspan x="402" dy="16">→ ~100 байт RAM</tspan></text><text x="270" y="106" text-anchor="middle" font-size="12" fill="#334155">yield превращает функцию в генератор:</text><rect x="20" y="118" width="500" height="60" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="124" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">def squares(n):</tspan><tspan x="270" dy="16">    for i in range(n):</tspan><tspan x="270" dy="16">        yield i**2          # пауза, вернуть значение</tspan><tspan x="270" dy="16"># next() → следующее значение | for x in squares(5): — перебрать все</tspan></text><rect x="20" y="186" width="235" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="137" y="198" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="137" dy="0">yield — пауза и возврат</tspan><tspan x="137" dy="16">next() — возобновить</tspan></text><rect x="285" y="186" width="235" height="40" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="402" y="198" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="402" dy="0">yield from iterable</tspan><tspan x="402" dy="16">→ делегировать другому gen.</tspan></text></svg>