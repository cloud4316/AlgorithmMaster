<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="260" y="18" text-anchor="middle" font-size="14" fill="#1e293b">SOLID: пять принципов ООП</text><rect x="20" y="34" width="28" height="36" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="34" y="52" text-anchor="middle" font-size="16" fill="#0369a1" dominant-baseline="middle"><tspan x="34" dy="0">S</tspan></text><rect x="56" y="34" width="180" height="36" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="146" y="52" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="146" dy="0">Single Responsibility</tspan></text><text x="280" y="52" text-anchor="start" font-size="11" fill="#475569">один класс = одна причина изменений</text><rect x="20" y="78" width="28" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="34" y="96" text-anchor="middle" font-size="16" fill="#15803d" dominant-baseline="middle"><tspan x="34" dy="0">O</tspan></text><rect x="56" y="78" width="180" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="146" y="96" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="146" dy="0">Open/Closed</tspan></text><text x="280" y="96" text-anchor="start" font-size="11" fill="#475569">открыт для расширения, закрыт для изменений</text><rect x="20" y="122" width="28" height="36" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="34" y="140" text-anchor="middle" font-size="16" fill="#4c1d95" dominant-baseline="middle"><tspan x="34" dy="0">L</tspan></text><rect x="56" y="122" width="180" height="36" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="146" y="140" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="146" dy="0">Liskov Substitution</tspan></text><text x="280" y="140" text-anchor="start" font-size="11" fill="#475569">подкласс можно подставить вместо базового</text><rect x="20" y="166" width="28" height="36" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="34" y="184" text-anchor="middle" font-size="16" fill="#854d0e" dominant-baseline="middle"><tspan x="34" dy="0">I</tspan></text><rect x="56" y="166" width="180" height="36" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="146" y="184" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="146" dy="0">Interface Segregation</tspan></text><text x="280" y="184" text-anchor="start" font-size="11" fill="#475569">много мелких интерфейсов > одного большого</text><rect x="20" y="210" width="28" height="36" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34" y="228" text-anchor="middle" font-size="16" fill="#991b1b" dominant-baseline="middle"><tspan x="34" dy="0">D</tspan></text><rect x="56" y="210" width="180" height="36" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="146" y="228" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="146" dy="0">Dependency Inversion</tspan></text><text x="280" y="228" text-anchor="start" font-size="11" fill="#475569">зависеть от абстракций, не от конкреций</text></svg>