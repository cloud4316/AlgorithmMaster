<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 266" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">REST API: методы и коды ответа</text><rect x="20" y="36" width="100" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="70" y="51" text-anchor="middle" font-size="13" fill="#15803d" dominant-baseline="middle"><tspan x="70" dy="0">GET</tspan></text><text x="200" y="51" text-anchor="start" font-size="11" fill="#334155">Получить ресурс (безопасный)</text><rect x="20" y="74" width="100" height="30" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="70" y="89" text-anchor="middle" font-size="13" fill="#0369a1" dominant-baseline="middle"><tspan x="70" dy="0">POST</tspan></text><text x="200" y="89" text-anchor="start" font-size="11" fill="#334155">Создать ресурс</text><rect x="20" y="112" width="100" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="70" y="127" text-anchor="middle" font-size="13" fill="#854d0e" dominant-baseline="middle"><tspan x="70" dy="0">PUT</tspan></text><text x="200" y="127" text-anchor="start" font-size="11" fill="#334155">Заменить полностью</text><rect x="20" y="150" width="100" height="30" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="70" y="165" text-anchor="middle" font-size="13" fill="#4c1d95" dominant-baseline="middle"><tspan x="70" dy="0">PATCH</tspan></text><text x="200" y="165" text-anchor="start" font-size="11" fill="#334155">Частичное обновление</text><rect x="20" y="188" width="100" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="70" y="203" text-anchor="middle" font-size="13" fill="#991b1b" dominant-baseline="middle"><tspan x="70" dy="0">DELETE</tspan></text><text x="200" y="203" text-anchor="start" font-size="11" fill="#334155">Удалить ресурс</text><rect x="330" y="36" width="80" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="370" y="51" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="370" dy="0">200 OK</tspan></text><text x="450" y="51" text-anchor="start" font-size="11" fill="#475569">Успех</text><rect x="330" y="74" width="80" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="370" y="89" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="370" dy="0">201 Created</tspan></text><text x="450" y="89" text-anchor="start" font-size="11" fill="#475569">Создан</text><rect x="330" y="112" width="80" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="370" y="127" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="370" dy="0">400 Bad Req</tspan></text><text x="450" y="127" text-anchor="start" font-size="11" fill="#475569">Плохой запрос</text><rect x="330" y="150" width="80" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="370" y="165" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="370" dy="0">401/403</tspan></text><text x="450" y="165" text-anchor="start" font-size="11" fill="#475569">Не авторизован</text><rect x="330" y="188" width="80" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="370" y="203" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="370" dy="0">404 Not Found</tspan></text><text x="450" y="203" text-anchor="start" font-size="11" fill="#475569">Не найден</text><rect x="20" y="226" width="500" height="28" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="270" y="240" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="270" dy="0">JSON — стандартный формат REST. URL: /api/users/{id}  |  Версионирование: /api/v2/...</tspan></text></svg>