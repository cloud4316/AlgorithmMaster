<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 228" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Модули и пакеты Python</text><rect x="20" y="36" width="155" height="40" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="97" y="56" text-anchor="middle" font-size="13" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">import math</tspan></text><rect x="193" y="36" width="155" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="56" text-anchor="middle" font-size="13" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">from math import sqrt</tspan></text><rect x="366" y="36" width="155" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="443" y="56" text-anchor="middle" font-size="13" fill="#4c1d95" dominant-baseline="middle"><tspan x="443" dy="0">import numpy as np</tspan></text><rect x="20" y="90" width="500" height="44" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="270" y="104" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">sys.path: [текущий каталог] → [stdlib] → [site-packages pip]</tspan><tspan x="270" dy="16">Python ищет модуль именно в таком порядке</tspan></text><text x="270" y="148" text-anchor="middle" font-size="12" fill="#334155">Структура пакета:</text><rect x="20" y="158" width="235" height="56" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="137" y="162" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">mypackage/</tspan><tspan x="137" dy="16">  __init__.py</tspan><tspan x="137" dy="16">  module_a.py</tspan><tspan x="137" dy="16">  module_b.py</tspan></text><rect x="285" y="158" width="235" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="170" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">from mypackage import module_a</tspan><tspan x="402" dy="16">from mypackage.module_a import func</tspan><tspan x="402" dy="16">if __name__ == "__main__": ...</tspan></text></svg>