<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 246" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669" /></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626" /></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Профилирование и оптимизация Python</text><rect x="20" y="36" width="235" height="40" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="137" y="48" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">timeit — точное время</tspan><tspan x="137" dy="16">timeit.timeit("1+1",number=1000000)</tspan></text><rect x="285" y="36" width="235" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="402" y="48" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">time.perf_counter()</tspan><tspan x="402" dy="16">Временной блок кода</tspan></text><rect x="20" y="84" width="235" height="40" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" /><text x="137" y="96" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">cProfile — статистика вызовов</tspan><tspan x="137" dy="16">python -m cProfile -s cumtime app.py</tspan></text><rect x="285" y="84" width="235" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="402" y="96" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="402" dy="0">memory_profiler — расход RAM</tspan><tspan x="402" dy="16">@profile декоратор</tspan></text><rect x="20" y="132" width="500" height="64" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" /><text x="270" y="150" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">python -m cProfile script.py  |  %timeit в Jupyter  |  line_profiler для построчного анализа</tspan></text><text x="270" y="182" text-anchor="middle" font-size="12" fill="#334155">Основные советы оптимизации:</text><rect x="20" y="192" width="235" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" /><text x="137" y="204" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0">set/dict вместо list для поиска</tspan><tspan x="137" dy="16">list comprehension вместо for+append</tspan></text><rect x="285" y="192" width="235" height="40" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5" /><text x="402" y="204" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="402" dy="0">NumPy вместо циклов по числам</tspan><tspan x="402" dy="16">generators вместо списков (RAM)</tspan></text></svg>