<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 292" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Абстрактные классы (ABC)</text><rect x="20" y="36" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="54" text-anchor="middle" font-size="13" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">from abc import ABC, abstractmethod</tspan></text><rect x="160" y="80" width="220" height="44" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="270" y="86" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="270" dy="0">class Shape(ABC):</tspan><tspan x="270" dy="16">  @abstractmethod</tspan><tspan x="270" dy="16">  def area(self): ...</tspan></text><line x1="270" y1="124" x2="200" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/><line x1="270" y1="124" x2="340" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="100" y="148" width="160" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="180" y="154" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="180" dy="0">class Circle(Shape):</tspan><tspan x="180" dy="16">  def area(self):</tspan><tspan x="180" dy="16">    return pi*r*r</tspan></text><rect x="280" y="148" width="160" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="360" y="154" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="360" dy="0">class Rect(Shape):</tspan><tspan x="360" dy="16">  def area(self):</tspan><tspan x="360" dy="16">    return w*h</tspan></text><rect x="20" y="204" width="500" height="36" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="270" y="214" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="270" dy="0">Shape()  →  TypeError: нельзя создать экземпляр абстрактного класса</tspan><tspan x="270" dy="16">Garantirует реализацию всех @abstractmethod в дочернем классе</tspan></text><rect x="20" y="248" width="235" height="30" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="137" y="263" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="137" dy="0">@abstractmethod: обязательный метод</tspan></text><rect x="285" y="248" width="235" height="30" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="402" y="263" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="402" dy="0">isinstance(obj,Shape)  →  True</tspan></text></svg>