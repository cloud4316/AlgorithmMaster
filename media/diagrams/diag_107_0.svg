<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 226" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">ORM vs чистый SQL: сравнение подходов</text><rect x="20" y="36" width="235" height="60" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="137" y="50" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="137" dy="0">Чистый SQL:</tspan><tspan x="137" dy="16">cur.execute("SELECT * FROM users WHERE age>?",(18,))</tspan><tspan x="137" dy="16">rows=cur.fetchall()</tspan></text><rect x="285" y="36" width="235" height="60" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="50" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">Django ORM:</tspan><tspan x="402" dy="16">User.objects.filter(age__gt=18)</tspan><tspan x="402" dy="16">.values("name","email")</tspan></text><rect x="20" y="108" width="235" height="60" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="137" y="122" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">SQLAlchemy ORM:</tspan><tspan x="137" dy="16">db.query(User).filter(User.age>18)</tspan><tspan x="137" dy="16">.all()</tspan></text><rect x="285" y="108" width="235" height="60" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="402" y="130" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="402" dy="0">SQLAlchemy Core:</tspan><tspan x="402" dy="16">select(users).where(users.c.age>18)</tspan></text><rect x="20" y="176" width="235" height="36" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="137" y="186" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0">ORM +: читаемость, безопасность,</tspan><tspan x="137" dy="16">миграции, переносимость БД</tspan></text><rect x="285" y="176" width="235" height="36" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="402" y="186" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="402" dy="0">SQL +: полный контроль,</tspan><tspan x="402" dy="16">сложные запросы, производительность</tspan></text></svg>