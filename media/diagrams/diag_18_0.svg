<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 214" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Множество (set): свойства и операции</text><rect x="20" y="36" width="155" height="44" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="97" y="50" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="97" dy="0">set() / {1,2,3}</tspan><tspan x="97" dy="17">Нет дубликатов!</tspan></text><rect x="193" y="36" width="155" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="270" y="50" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="270" dy="0">O(1): x in s</tspan><tspan x="270" dy="17">O(1): s.add(x)</tspan></text><rect x="366" y="36" width="155" height="44" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="443" y="50" text-anchor="middle" font-size="12" fill="#854d0e" dominant-baseline="middle"><tspan x="443" dy="0">frozenset()</tspan><tspan x="443" dy="17">неизменяемое</tspan></text><rect x="20" y="96" width="155" height="44" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="97" y="118" text-anchor="middle" font-size="12" fill="#4c1d95" dominant-baseline="middle"><tspan x="97" dy="0">s1 | s2  объединение</tspan></text><rect x="193" y="96" width="155" height="44" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="270" y="118" text-anchor="middle" font-size="12" fill="#991b1b" dominant-baseline="middle"><tspan x="270" dy="0">s1 &amp; s2  пересечение</tspan></text><rect x="366" y="96" width="155" height="44" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="443" y="118" text-anchor="middle" font-size="12" fill="#9a3412" dominant-baseline="middle"><tspan x="443" dy="0">s1 - s2  разность</tspan></text><rect x="20" y="156" width="500" height="44" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="270" y="170" text-anchor="middle" font-size="11" fill="#334155" dominant-baseline="middle"><tspan x="270" dy="0">Уникальные: list(set([1,1,2,2,3])) → [1,2,3]</tspan><tspan x="270" dy="16">Проверка: 5 in {1,3,5,7} → True  (мгновенно, хеш!)</tspan></text></svg>