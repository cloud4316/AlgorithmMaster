<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 222" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">Группы и флаги регулярных выражений</text><rect x="20" y="36" width="235" height="40" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="137" y="48" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="137" dy="0">(pattern)  — захват группы</tspan><tspan x="137" dy="16">re.search(r"(\d+)",s).group(1)</tspan></text><rect x="285" y="36" width="235" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="402" y="48" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="402" dy="0">(?:pattern)  — без захвата</tspan><tspan x="402" dy="16">(?P&lt;name&gt;pattern)  — именованная</tspan></text><text x="270" y="90" text-anchor="middle" font-size="12" fill="#334155">Методы re:</text><rect x="20" y="102" width="115" height="30" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="77" y="117" text-anchor="middle" font-size="12" fill="#854d0e" dominant-baseline="middle"><tspan x="77" dy="0">re.match()</tspan></text><text x="78" y="140" text-anchor="middle" font-size="10" fill="#854d0e">только начало</text><rect x="145" y="102" width="115" height="30" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="202" y="117" text-anchor="middle" font-size="12" fill="#4c1d95" dominant-baseline="middle"><tspan x="202" dy="0">re.search()</tspan></text><text x="203" y="140" text-anchor="middle" font-size="10" fill="#4c1d95">первое вхождение</text><rect x="270" y="102" width="115" height="30" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="327" y="117" text-anchor="middle" font-size="12" fill="#991b1b" dominant-baseline="middle"><tspan x="327" dy="0">re.findall()</tspan></text><text x="328" y="140" text-anchor="middle" font-size="10" fill="#991b1b">все вхождения</text><rect x="395" y="102" width="125" height="30" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="457" y="117" text-anchor="middle" font-size="12" fill="#9a3412" dominant-baseline="middle"><tspan x="457" dy="0">re.sub(p,r,s)</tspan></text><text x="458" y="140" text-anchor="middle" font-size="10" fill="#9a3412">замена</text><text x="270" y="158" text-anchor="middle" font-size="11" fill="#475569">Флаги: re.IGNORECASE (i) | re.MULTILINE (m) | re.DOTALL (s)</text><rect x="20" y="168" width="500" height="40" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="180" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">p = re.compile(r"\d+", re.IGNORECASE)  # компилируем для ускорения</tspan><tspan x="270" dy="16">p.findall("123 abc 456")  →  ["123","456"]</tspan></text></svg>