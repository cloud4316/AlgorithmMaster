<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 236" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b" /></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">input() и преобразование типов</text><rect x="180" y="32" width="180" height="40" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" /><text x="270" y="52" text-anchor="middle" font-size="13" fill="#e2e8f0" dominant-baseline="middle"><tspan x="270" dy="0">input("Введите: ")</tspan></text><line x1="270" y1="72" x2="270" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)" /><rect x="175" y="108" width="190" height="36" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" /><text x="270" y="126" text-anchor="middle" font-size="13" fill="#854d0e" dominant-baseline="middle"><tspan x="270" dy="0">Всегда возвращает str!</tspan></text><text x="270" y="156" text-anchor="middle" font-size="11" fill="#475569">Нужен другой тип? Явное преобразование:</text><rect x="38" y="166" width="110" height="60" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" /><text x="93" y="184" text-anchor="middle" font-size="12" fill="#0369a1" dominant-baseline="middle"><tspan x="93" dy="0">int(x)</tspan></text><text x="93" y="212" text-anchor="middle" font-size="10" fill="#64748b">целое число</text><rect x="154" y="166" width="110" height="60" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="209" y="184" text-anchor="middle" font-size="12" fill="#15803d" dominant-baseline="middle"><tspan x="209" dy="0">float(x)</tspan></text><text x="209" y="212" text-anchor="middle" font-size="10" fill="#64748b">дробное</text><rect x="270" y="166" width="110" height="60" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="325" y="184" text-anchor="middle" font-size="12" fill="#4c1d95" dominant-baseline="middle"><tspan x="325" dy="0">bool(x)</tspan></text><text x="325" y="212" text-anchor="middle" font-size="10" fill="#64748b">True/False</text><rect x="386" y="166" width="110" height="60" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" /><text x="441" y="184" text-anchor="middle" font-size="12" fill="#9a3412" dominant-baseline="middle"><tspan x="441" dy="0">list(x)</tspan></text><text x="441" y="212" text-anchor="middle" font-size="10" fill="#64748b">список</text></svg>