<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 258" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#059669"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker></defs><text x="270" y="18" text-anchor="middle" font-size="14" fill="#1e293b">sqlite3: CRUD операции с базой данных</text><rect x="20" y="36" width="500" height="36" rx="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/><text x="270" y="54" text-anchor="middle" font-size="11" fill="#94a3b8" dominant-baseline="middle"><tspan x="270" dy="0">import sqlite3; conn=sqlite3.connect("db.sqlite3"); cur=conn.cursor()</tspan></text><rect x="20" y="80" width="235" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="137" y="92" text-anchor="middle" font-size="11" fill="#15803d" dominant-baseline="middle"><tspan x="137" dy="0">C — CREATE / INSERT</tspan><tspan x="137" dy="16">cur.execute("INSERT INTO t VALUES(?,?)",(a,b))</tspan></text><rect x="285" y="80" width="235" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="402" y="92" text-anchor="middle" font-size="11" fill="#0369a1" dominant-baseline="middle"><tspan x="402" dy="0">R — SELECT</tspan><tspan x="402" dy="16">rows=cur.execute("SELECT * FROM t").fetchall()</tspan></text><rect x="20" y="128" width="235" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="137" y="140" text-anchor="middle" font-size="11" fill="#854d0e" dominant-baseline="middle"><tspan x="137" dy="0">U — UPDATE</tspan><tspan x="137" dy="16">cur.execute("UPDATE t SET x=? WHERE id=?",(v,i))</tspan></text><rect x="285" y="128" width="235" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="402" y="140" text-anchor="middle" font-size="11" fill="#991b1b" dominant-baseline="middle"><tspan x="402" dy="0">D — DELETE</tspan><tspan x="402" dy="16">cur.execute("DELETE FROM t WHERE id=?",(i,))</tspan></text><rect x="20" y="176" width="500" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="270" y="185" text-anchor="middle" font-size="11" fill="#4c1d95" dominant-baseline="middle"><tspan x="270" dy="0">ОБЯЗАТЕЛЬНО: conn.commit() после изменений | conn.close() в конце</tspan><tspan x="270" dy="16">Или: with conn: — авто-commit при выходе</tspan></text><rect x="20" y="218" width="500" height="28" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="270" y="232" text-anchor="middle" font-size="11" fill="#9a3412" dominant-baseline="middle"><tspan x="270" dy="0">Параметры: ? — защита от SQL-инъекций! Никогда не форматируй строки вручную.</tspan></text></svg>